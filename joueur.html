<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Padel+ · Mon tournoi</title><meta name="robots" content="noindex"><meta name="theme-color" content="#141c4a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mon tournoi"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--ink:#141c4a;--lime:#b6ef2a;--blue:#2a4bc4;--mu:#5a6690;--line:#dfe4f3;--ok:#3b6d11;--okb:#eaf3de;--ko:#a32d2d;--kob:#fcebeb;--bg:#eef1fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
.top .w{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}.top img{width:40px;height:40px;border-radius:11px;flex:none}
.top b{display:block;font-size:17px;line-height:1.2}.top small{display:block;color:#c6d0f5;font-weight:600;font-size:13px;margin-top:2px}
.ph{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;letter-spacing:.08em;border-radius:99px;padding:3px 9px;color:#fff}
.c{max-width:560px;margin:0 auto;padding:14px}
.box{background:#fff;border-radius:18px;padding:15px 16px;box-shadow:0 6px 20px rgba(20,28,74,.07);margin:0 0 12px}
.sh{display:flex;align-items:center;gap:12px;margin:20px 4px 8px;font-size:20px;font-weight:900;color:var(--ink)}.sh i{font-style:normal;flex:none;width:40px;height:40px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 8px rgba(20,28,74,.18)}.sh .pnote{font-size:13px;font-weight:700;color:var(--mu);line-height:1.3}.sh small{margin-left:auto;font-size:12px;font-weight:800;color:var(--mu)}
.box.sb{border-left:7px solid var(--s);padding:8px 16px 10px 16px}.box.sb>.kv:first-child{border-top:0}
.tm{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px;min-width:0}.tm:first-child{border-top:0}.tm .nm{flex:1;min-width:0}.dot{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--mu);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.hv{--p:#cfe9bd;--s:#3b8a1e}.he{--p:#f6c6d5;--s:#d9467a}.hp{--p:#c4d3f8;--s:#2a4bc4}.hs{--p:#f9dcb3;--s:#e08a1e}
.ho{--p:#e4f7b8;--s:#8fc417}
.tm.pt{align-items:center}
.tm.pme{background:#fff8cc;margin:0 -8px;padding:9px 8px;border-radius:10px}
.ppl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.ppl b{font-weight:800}
.pcl{margin-left:6px;font-size:12px;font-weight:700;color:var(--mu)}
.ptoi{font-style:normal;font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--ink);background:#fff1a8;border-radius:99px;padding:1px 7px;display:inline-block;margin-bottom:2px}
.pteam{flex:none;text-align:right;line-height:1.1}
.pteam small{display:block;font-size:9.5px;font-weight:900;letter-spacing:.08em;color:var(--mu)}
.pteam b{font-size:16px;font-weight:900}
.box.ho{background:#fbfff0}
.box.ho .dot{background:#141c4a;color:#b6ef2a}
.lab{font-size:12px;font-weight:900;letter-spacing:.07em;color:var(--mu);margin:0 0 8px;text-transform:uppercase}
h1{font-size:22px;margin:0 0 6px}p{margin:0 0 8px;color:var(--mu);line-height:1.45}
.nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}.nm b{font-weight:800}
.hero{border-radius:20px;padding:18px;margin:0 0 12px;color:#fff;background:var(--ink);text-align:center}
.hero .k{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--lime)}
.hero .w{font-size:30px;font-weight:900;margin:4px 0 2px;line-height:1.1}
.hero .s{color:#c6d0f5;font-size:14px;font-weight:700;margin:8px 0 4px}
.hero .t{font-size:16px;font-weight:800}
.hero .cd{display:inline-block;background:var(--lime);color:var(--ink);border-radius:99px;padding:5px 12px;font-weight:900;font-size:14px;margin-top:10px}
.hero.go{background:#2f7d14;animation:pu 1.6s ease-in-out infinite}.hero.go .k{color:#fff}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(47,125,20,.55)}50%{box-shadow:0 0 0 12px rgba(47,125,20,0)}}
.hero.win{background:linear-gradient(160deg,#141c4a,#2a3a94)}.hero .med{font-size:54px;line-height:1}
.bt{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:900;background:var(--lime);color:var(--ink);cursor:pointer;margin:0 0 10px;text-decoration:none;text-align:center;font-family:inherit}
.bt.sec{background:#fff;border:2px solid var(--line);font-size:16px;padding:13px}.bt.no{background:none;color:var(--ko);font-size:15px;padding:10px;font-weight:800}
.bt.done{background:var(--okb);color:var(--ok);border:2px solid #97c459;cursor:default}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}.g2 .bt{margin:0;font-size:15px;padding:13px 8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}.kv:first-of-type{border-top:0}.kv span{color:var(--mu)}.kv b{text-align:right}
table{width:100%;border-collapse:collapse;font-size:14.5px;table-layout:fixed}th{color:var(--mu);font-size:11.5px;font-weight:800;text-align:center;padding:4px 2px}th.l,td.l{text-align:left}
td{padding:8px 2px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}tr.me td{background:#fff3c4}tr.q td:first-child{color:var(--ok);font-weight:900}
.m{border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin:0 0 8px;background:#fff}.m.mine{border:2px solid var(--blue);background:#f6f8ff}
.mh{display:flex;justify-content:space-between;gap:8px;color:var(--mu);font-size:12px;font-weight:800;margin:0 0 4px}
.mr{display:flex;align-items:center;gap:8px;padding:3px 0}.mr .tm{flex:1;min-width:0;font-size:14px}.mr .sc{font-weight:900;font-size:16px;min-width:24px;text-align:right}.mr.w .tm b{color:var(--ok)}
.lv{color:#e03131;font-weight:900}
.res{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.res:first-of-type{border-top:0}
.res .r{font-weight:900;white-space:nowrap}.res .r.v{color:var(--ok)}.res .r.d{color:var(--ko)}.res .r.n{color:var(--mu);font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs button{flex:1;border:0;background:none;font-family:inherit;font-size:12px;font-weight:800;color:var(--mu);padding:6px 0;cursor:pointer}.tabs button i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}.tabs button.on{color:var(--ink)}.tabs button.on i{transform:scale(1.12)}
.pc{border-radius:14px;padding:11px 12px;margin:0 0 8px;background:#fff;border-left:5px solid var(--line)}.pc.live{border-left-color:#e03131}.pc.free{border-left-color:#97c459}
.pc b.p{font-size:15px}.pc small{color:var(--mu);font-weight:700}
.sr{width:100%;font-size:17px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;margin:0 0 10px;outline:0;font-family:inherit}.sr:focus{border-color:var(--blue)}
.pl{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;margin:0 0 8px;font-size:16px;color:var(--ink);text-align:left;cursor:pointer;font-family:inherit}.pl .nm{flex:1;min-width:0}.pl small{color:var(--mu);font-weight:700;font-size:13px}
.a2h{background:#fff;border:2px dashed #b5c0ef;border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14px;color:var(--mu)}.a2h b{color:var(--ink)}.a2h button{float:right;border:0;background:none;font-size:18px;color:var(--mu);cursor:pointer}
.err{color:var(--ko);font-weight:700}.sm{font-size:12.5px}
.big{font-size:56px;text-align:center;line-height:1.1;margin:6px 0}
.pod{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}.pod:first-of-type{border-top:0}.pod i{font-style:normal;font-size:20px;width:28px;text-align:center}
.upd{text-align:center;font-size:12px;color:var(--mu);margin:4px 0 10px}
.sbt{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}.sbt button{flex:none;border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-weight:800;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer}.sbt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.nxt{background:#eaf3de;color:#27500a;border-radius:14px;padding:12px 14px;font-weight:800;font-size:15px;line-height:1.4;margin:0 0 12px}

.toik{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:900;letter-spacing:.12em;color:var(--lime)}
.toik i{width:9px;height:9px;border-radius:50%;background:var(--lime);animation:toiB 1.4s infinite}
@keyframes toiB{0%{box-shadow:0 0 0 0 rgba(182,239,42,.6)}70%{box-shadow:0 0 0 9px rgba(182,239,42,0)}100%{box-shadow:0 0 0 0 rgba(182,239,42,0)}}
.toir{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.toin{width:84px;height:84px;flex:none;border-radius:22px;background:var(--lime);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(182,239,42,.35)}
.toin small{font-size:10px;font-weight:900;letter-spacing:.14em;margin-bottom:-4px}
.toin b{font-size:50px;font-weight:900;line-height:1;letter-spacing:-.03em}
.toit{min-width:0}
.toit b{display:block;font-size:20px;font-weight:900;line-height:1.15}
.toit span{display:block;color:#c6d0f5;font-size:14px;margin-top:4px}
.toit strong{color:#fff}
.toisc{display:block;margin-top:14px;background:var(--lime);color:var(--ink);text-align:center;border-radius:14px;padding:12px;font-weight:900;font-size:15px;text-decoration:none}
@keyframes toiIn{from{opacity:0;transform:translateY(-10px) scale(.97)}}
.pc{display:flex;align-items:flex-start;margin:0 2px 12px;gap:0}
.pcn{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;width:52px;font-size:10.5px;font-weight:800;color:#8a93b8;text-align:center}
.pcn i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;background:#e3e8f7;color:#8a93b8}
.pcn.w i{background:#1f9d57;color:#fff}.pcn.l i{background:#e4484d;color:#fff}
.pcn.n i{background:#2f5bff;color:#fff;animation:pcB 1.4s infinite}
.pcn.w,.pcn.n,.pcn.l{color:var(--ink)}
@keyframes pcB{0%{box-shadow:0 0 0 0 rgba(47,91,255,.5)}70%{box-shadow:0 0 0 8px rgba(47,91,255,0)}100%{box-shadow:0 0 0 0 rgba(47,91,255,0)}}
.pcl{flex:1;height:3px;border-radius:99px;background:#e3e8f7;margin-top:10px;min-width:10px}
.pcl.on{background:#1f9d57}
