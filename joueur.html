<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Padel+ · Mon tournoi</title><meta name="robots" content="noindex"><meta name="theme-color" content="#141c4a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mon tournoi"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--ink:#141c4a;--lime:#b6ef2a;--blue:#2a4bc4;--mu:#5a6690;--line:#dfe4f3;--ok:#3b6d11;--okb:#eaf3de;--ko:#a32d2d;--kob:#fcebeb;--bg:#eef1fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom))}

.ph{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;letter-spacing:.08em;border-radius:99px;padding:3px 9px;color:#fff}
.c{max-width:560px;margin:0 auto;padding:14px}
.box{background:#fff;border-radius:18px;padding:15px 16px;box-shadow:0 6px 20px rgba(20,28,74,.07);margin:0 0 12px}
.box.hb{padding:0 16px 12px;overflow:hidden;border:1.5px solid var(--b)}.box.hb>.lab{display:flex;align-items:center;gap:10px;margin:0 -16px 6px;padding:10px 14px;background:var(--c);color:var(--t);font-size:15px;letter-spacing:.03em}.box.hb>.lab i{font-style:normal;flex:none;width:30px;height:30px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;letter-spacing:0}.box.hb>.lab+.kv{border-top:0}
.hv{--c:#eaf5e2;--b:#c5e3b1;--t:#3b6d11}.he{--c:#fde8ee;--b:#f5c2d1;--t:#b8285a}.hp{--c:#cfdcfa;--b:#94acec;--t:#1f3fae}.hs{--c:#fdf1e0;--b:#f3d6ad;--t:#b4650a}
.lab{font-size:12px;font-weight:900;letter-spacing:.07em;color:var(--mu);margin:0 0 8px;text-transform:uppercase}
h1{font-size:22px;margin:0 0 6px}p{margin:0 0 8px;color:var(--mu);line-height:1.45}
.nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}.nm b{font-weight:800}
.hero{border-radius:20px;padding:18px;margin:0 0 12px;color:#fff;background:var(--ink);text-align:center}
.hero .k{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--lime)}
.hero .w{font-size:30px;font-weight:900;margin:4px 0 2px;line-height:1.1}

.hero .t{font-size:16px;font-weight:800}

.hero.go{background:#2f7d14;animation:pu 1.6s ease-in-out infinite}.hero.go .k{color:#fff}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(47,125,20,.55)}50%{box-shadow:0 0 0 12px rgba(47,125,20,0)}}
.hero.win{background:linear-gradient(160deg,#141c4a,#2a3a94)}.hero .med{font-size:54px;line-height:1}
.bt{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:900;background:var(--lime);color:var(--ink);cursor:pointer;margin:0 0 10px;text-decoration:none;text-align:center;font-family:inherit}

table{width:100%;border-collapse:collapse;font-size:14.5px;table-layout:fixed}th{color:var(--mu);font-size:11.5px;font-weight:800;text-align:center;padding:4px 2px}th.l,td.l{text-align:left}

.lv{color:#e03131;font-weight:900}

.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs button{flex:1;border:0;background:none;font-family:inherit;font-size:12px;font-weight:800;color:var(--mu);padding:6px 0;cursor:pointer}.tabs button i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}.tabs button.on{color:var(--ink)}.tabs button.on i{transform:scale(1.12)}
.pc{border-radius:14px;padding:11px 12px;margin:0 0 8px;background:#fff;border-left:5px solid var(--line)}.pc.live{border-left-color:#e03131}.pc.free{border-left-color:#97c459}
.pc b.p{font-size:15px}.pc small{color:var(--mu);font-weight:700}
.sr{width:100%;font-size:17px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;margin:0 0 10px;outline:0;font-family:inherit}.sr:focus{border-color:var(--blue)}
.pl{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;margin:0 0 8px;font-size:16px;color:var(--ink);text-align:left;cursor:pointer;font-family:inherit}.pl .nm{flex:1;min-width:0}.pl small{color:var(--mu);font-weight:700;font-size:13px}
.a2h{background:#fff;border:2px dashed #b5c0ef;border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14px;color:var(--mu)}.a2h b{color:var(--ink)}.a2h button{float:right;border:0;background:none;font-size:18px;color:var(--mu);cursor:pointer}
.err{color:var(--ko);font-weight:700}.sm{font-size:12.5px}
.big{font-size:56px;text-align:center;line-height:1.1;margin:6px 0}
.pod{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}.pod:first-of-type{border-top:0}.pod i{font-style:normal;font-size:20px;width:28px;text-align:center}
.upd{text-align:center;font-size:12px;color:var(--mu);margin:4px 0 10px}
.sbt{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}.sbt button{flex:none;border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-weight:800;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer}.sbt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.nxt{background:#eaf3de;color:#27500a;border-radius:14px;padding:12px 14px;font-weight:800;font-size:15px;line-height:1.4;margin:0 0 12px}
</style></head><body>
<div class="top"><div class="w"><img src="icon-192.png" alt=""><div style="min-width:0;flex:1"><b id="tt">Mon tournoi</b><small id="st">Padel+</small><span id="ph"></span></div></div></div>
<div class="c" id="m"><p>Chargement…</p></div>
<div class="tabs" id="tabs" style="display:none"></div>
<script>
const Q=new URLSearchParams(location.search),$=id=>document.getElementById(id),m=$("m");
const ref=Q.get("r")||"",key=Q.get("k")||"",pid=Q.get("i")||"",own=Q.get("o")||"";
const d64=t=>{try{t=(t||"").replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return decodeURIComponent(escape(atob(t)))}catch(e){return""}};
let PL=[];try{PL=JSON.parse(d64(Q.get("p")))||[]}catch(e){}
const T0=d64(Q.get("t"));
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nz=x=>String(x||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const H={"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json"},API="https://"+ref+".supabase.co/rest/v1/";
const LS=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},LW=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const MEK="pj_me_"+(pid||own);
const AUTO=Q.get("c")=="1";let autoT=false;
let D=null,me=LS(MEK),tab="moi",pq="",err="",last=0,busy=false,sub=null;
/* me = {u:uid, tok, n:name} ; résolu en {t,k} via D.T */
function who(){if(!D||!me)return null;for(let t=0;t<D.T.length;t++){const T=D.T[t];if(T[2])continue;if(me.u&&T[7]==me.u)return{t,k:"a"};if(me.u&&T[8]==me.u)return{t,k:"b"}}
if(me.t!=null&&D.T[me.t]){const p=D.T[me.t][me.k=="b"?1:0];if(p&&nz(p[0]+p[1])==nz(me.nn||""))return{t:me.t,k:me.k}}return null}
async function load(force){if(busy)return;if(!ref||!key||(!pid&&!PL.length)){m.innerHTML='<div class="box"><h1>Lien incomplet</h1><p class="err">Demande le lien au juge-arbitre.</p></div>';return}
if(!pid){D=null;draw();return}busy=true;
try{const r=await fetch(API+"rpc/padel_live_get",{method:"POST",headers:H,body:JSON.stringify({pid})});if(!r.ok)throw new Error("Erreur "+r.status);const d=await r.json();if(d&&d.T){D=d;err="";last=Date.now()}else if(!D)err="wait"}catch(e){if(!D)err=e.message}busy=false;draw()}
const todayS=()=>new Date().toLocaleDateString("sv");
const fdate=d=>d?new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}):"";
const toMin=h=>{const x=/^(\d{1,2})[h:](\d{2})/.exec(h||"");return x?+x[1]*60+ +x[2]:null};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const tname=t=>{if(t==null||t<0||!D.T[t])return '<span class="nm" style="color:var(--mu)">à déterminer</span>';const T=D.T[t];return [0,1].map(j=>T[j]&&(T[j][0]||T[j][1])?`<span class="nm"><b>${esc(T[j][0])}</b> ${esc(T[j][1])}</span>`:"").join("")};
const tshort=t=>{if(t==null||t<0||!D.T[t])return"à déterminer";const T=D.T[t];return [T[0],T[1]].filter(p=>p&&p[0]).map(p=>p[0]).join(" / ")};
const myMs=w=>D.M.filter(x=>x.a==w.t||x.b==w.t);
const poolOf=t=>(D.G||[]).find(g=>g.r.some(r=>r[0]==t));
function phase(w){if(!D)return"avant";const td=todayS(),M=D.M||[],any=M.some(x=>x.st=="c"||x.st=="f"),all=M.length&&M.every(x=>x.st=="f"||x.a==null||x.b==null||x.a<0||x.b<0);
if(D.cl||(all&&any))return"apres";if(D.d&&D.d>td)return"avant";if(any)return"pendant";return D.d&&D.d<td?"apres":"jourj"}
const PH={avant:["AVANT LE TOURNOI","#6b7bd6"],jourj:["JOUR J","#e08a1e"],pendant:["EN DIRECT","#2f7d14"],apres:["TERMINÉ","#534ab7"]};
function header(){const t=D?(D.c||""):"",l=D?(D.l||""):"";$("tt").textContent=(D&&D.c)||T0||"Mon tournoi";$("st").textContent=[l,D&&D.d?fdate(D.d):""].filter(Boolean).join(" · ")||"Padel+"}
/* ---------- choix du joueur ---------- */
function pickFromList(){return `<div class="box"><h1>Qui es-tu ?</h1><p>👉 Touche <b>ton</b> nom${AUTO?" pour confirmer ton inscription":""}. Ton téléphone s’en souviendra.</p>${PL.map((x,i)=>`<button class="pl" onclick="setMe(${i})"><span class="nm">👤 ${esc(x[1])}</span></button>`).join("")}</div>`}
function setMe(i){const x=PL[i];me={u:x[2]||"",tok:x[0],n:x[1]};LW(MEK,me);draw();scrollTo(0,0)}
function players(){const L=[];D.T.forEach((T,t)=>{if(T[2])return;[0,1].forEach(j=>{const p=T[j];if(!p||!(p[0]||p[1]))return;const g=poolOf(t);L.push({t,k:j?"b":"a",n:p[0],f:p[1],u:T[7+j],g:g?g.n:"",key:nz(p[0]+" "+p[1]+" "+p[1]+" "+p[0])})})});return L.sort((a,b)=>a.n.localeCompare(b.n,"fr"))}
function pickSearch(){return `<div class="box"><h1>Qui es-tu ?</h1><p>Tape 2 ou 3 lettres de ton nom, puis touche-toi${AUTO?" pour confirmer ton inscription":""}. Ton téléphone s’en souviendra.</p><input class="sr" id="sr" placeholder="Ton nom…" value="${esc(pq)}" oninput="pq=this.value;$('pl').innerHTML=pickRows()" autocomplete="off" autocorrect="off" spellcheck="false"><div id="pl">${pickRows()}</div></div>`}
function pickRows(){const q=nz(pq).trim();if(q.length<2)return '<p class="sm">Les noms apparaissent dès 2 lettres.</p>';const F=players().filter(x=>q.split(/\s+/).every(w=>x.key.includes(w)));if(!F.length)return '<p>Personne avec ce nom. Vérifie l’orthographe ou demande au juge-arbitre.</p>';
return F.slice(0,20).map(x=>`<button class="pl" onclick="setMe2(${x.t},'${x.k}')"><span class="nm"><b>${esc(x.n)}</b> ${esc(x.f)}</span><small>${x.g?"Poule "+esc(x.g):""}</small></button>`).join("")}
function setMe2(t,k){const p=D.T[t][k=="b"?1:0];me={u:D.T[t][k=="b"?8:7]||"",t,k,nn:p[0]+p[1],n:(p[1]+" "+p[0]).trim()};LW(MEK,me);draw();scrollTo(0,0)}
function forget(){me=null;LW(MEK,null);tab="moi";draw()}
/* ---------- actions ---------- */
const doneK=k=>"pj_"+k+"_"+(pid||own);
async function confirmMe(){const tok=me.tok||(D&&D.tid&&me.u?D.tid+"."+me.u:"");const b=$("cfb");if(!tok||!own){if(b)b.textContent="Réponds au mail de convocation";return}if(b){b.disabled=true;b.textContent="Envoi…"}
try{const r=await fetch(API+"padel_confirm",{method:"POST",headers:{...H,"Prefer":"return=minimal"},body:JSON.stringify({owner:own,token:tok})});if(!r.ok)throw new Error("Erreur "+r.status);LW(doneK("cf"),1);draw()}catch(e){if(b){b.disabled=false;b.textContent="✅ Réessayer"}toast("La confirmation n’est pas passée. Vérifie ta connexion.")}}
async function arrived(w){const b=$("arb");if(b){b.disabled=true;b.textContent="Envoi…"}
try{const r=await fetch(API+"rpc/padel_checkin_add",{method:"POST",headers:H,body:JSON.stringify({pid,tt:w.t,pp:w.k})});if(!r.ok)throw new Error("Erreur "+r.status);const ok=await r.json();if(ok===false)throw new Error("Le pointage n’est pas ouvert.");LW(doneK("ar"),1);draw();toast("📍 Le juge-arbitre sait que tu es là. Bon tournoi !")}catch(e){if(b){b.disabled=false;b.textContent="📍 Réessayer"}toast(e.message||"Pas de connexion")}}
function noGo(){const tel="";m.insertAdjacentHTML("afterbegin",'<div class="box" id="ng"><h1>Tu ne peux pas venir ?</h1><p>Préviens le juge-arbitre au plus vite en répondant au mail ou au SMS de convocation : il pourra donner ta place à une équipe en attente.</p><button class="bt sec" onclick="this.parentNode.remove()">J’ai compris</button></div>');scrollTo(0,0)}
function ics(){if(!D||!D.d)return;const d=D.d.replace(/-/g,""),w=who(),cv=w?(D.T[w.t][9]||D.h0||"09:00"):(D.h0||"09:00"),hm=(cv||"09:00").replace(/[h:]/,"").padStart(4,"0").slice(0,4);
const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Padel+//FR","BEGIN:VEVENT","UID:"+(pid||"t")+"@padelplus","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART:"+d+"T"+hm+"00","DURATION:PT6H","SUMMARY:Tournoi "+(D.c||"padel"),"LOCATION:"+[D.l,D.a].filter(Boolean).join(", "),"DESCRIPTION:Convocation "+cv,"BEGIN:VALARM","TRIGGER:-PT2H","ACTION:DISPLAY","DESCRIPTION:Tournoi de padel","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
const a=document.createElement("a");a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(txt);a.download="tournoi.ics";document.body.appendChild(a);a.click();a.remove()}
const mapsUrl=()=>"https://maps.apple.com/?q="+encodeURIComponent([D.l,D.a].filter(Boolean).join(", "));
function scoreUrl(x){if(!D.sc||!x||!x.p)return"";const ck=D.sc.ck&&D.sc.ck[x.p];if(!ck)return"";return "score.html?r="+encodeURIComponent(ref)+"&o="+encodeURIComponent(D.sc.o)+"&c="+x.p+"&ck="+encodeURIComponent(ck)+"&k="+encodeURIComponent(key)}
let tt=null;function toast(t){let e=$("toast");if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#141c4a;color:#fff;border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;z-index:20;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)";document.body.appendChild(e)}e.textContent=t;e.style.display="block";clearTimeout(tt);tt=setTimeout(()=>e.style.display="none",3500)}
/* ---------- briques ---------- */
function nextOf(w){const L=myMs(w).filter(x=>x.st!="f"&&x.a!=null&&x.b!=null&&x.a>=0&&x.b>=0);L.sort((a,b)=>(a.st=="c"?-1:0)-(b.st=="c"?-1:0)||(toMin(a.h)??9999)-(toMin(b.h)??9999));return L[0]||null}
function heroNext(w,x){const op=x.a==w.t?x.b:x.a;if(x.st=="c")return `<div class="hero go"><div class="k">C’EST À TOI !</div><div class="w">PISTE ${x.p||"?"}</div><div class="s">${esc(x.l)} · contre</div><div class="t">${esc(tshort(op))}</div>${scoreUrl(x)?`<a class="bt" style="margin:14px 0 0" href="${scoreUrl(x)}">🎾 Envoyer le score</a>`:""}</div>`;
const tm=toMin(x.h),d=tm!=null&&D.d==todayS()?tm-nowMin():null;return `<div class="hero"><div class="k">TON PROCHAIN MATCH</div><div class="w">${x.h?esc(x.h):"Heure à venir"}</div><div class="s">${esc(x.l)} · contre</div><div class="t">${esc(tshort(op))}</div>${d!=null?`<span class="cd">${d>0?"dans "+(d>=60?Math.floor(d/60)+" h "+String(d%60).padStart(2,"0"):d+" min"):"d’un moment à l’autre"}</span>`:""}</div>`}
function poolBox(w,title){const g=poolOf(w.t);if(!g)return"";return `<div class="box"><div class="lab">${title||"Ma poule "+esc(g.n)}</div><table><colgroup><col style="width:9%"><col><col style="width:10%"><col style="width:10%"><col style="width:13%"><col style="width:12%"></colgroup><tr><th></th><th class="l">Équipe</th><th>J</th><th>V</th><th>+/-</th><th>Pts</th></tr>${g.r.map((r,k)=>`<tr class="${r[0]==w.t?"me":""}${r[5]?" q":""}"><td>${k+1}</td><td class="l">${r[0]==w.t?'<span class="nm"><b>Toi</b> · '+esc(tshort(r[0]))+'</span>':'<span class="nm">'+esc(tshort(r[0]))+'</span>'}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]>0?"+"+r[3]:r[3]}</td><td><b>${r[4]}</b></td></tr>`).join("")}</table>${D.q&&(D.G||[]).length&&D.M.some(x=>!x.g)?`<p class="sm" style="margin:8px 0 0">En vert : place${D.q>1?"s":""} qualificative${D.q>1?"s":""} pour le tableau.</p>`:""}</div>`}
function myRes(w){const L=myMs(w).filter(x=>x.a!=null&&x.b!=null&&x.a>=0&&x.b>=0);if(!L.length)return"";L.sort((a,b)=>(a.st=="f"?0:1)-(b.st=="f"?0:1)||(toMin(a.h)??9999)-(toMin(b.h)??9999));
return `<div class="box"><div class="lab">Mes matchs</div>${L.map(x=>{const i=x.a==w.t?0:1,op=i?x.a:x.b,sc=x.s?x.s.split(" ").map(z=>{const q=z.split("-");return i?q[1]+"-"+q[0]:z}).join(" "):"";let r;if(x.st=="f")r=`<span class="r ${x.w===i?"v":"d"}">${x.w===i?"Gagné":"Perdu"} ${esc(sc)}</span>`;else if(x.st=="c")r='<span class="r lv">● en cours</span>';else r=`<span class="r n">${esc(x.h||"")}</span>`;return `<div class="res"><span class="nm" style="flex:1">${x.st=="f"?"✓ ":""}vs ${esc(tshort(op))}<br><small style="color:var(--mu)">${esc(x.l)}</small></span>${r}</div>`}).join("")}</div>`}
function a2h(){if(LS("pj_a2h")||window.navigator.standalone)return"";return `<div class="a2h"><button onclick="LW('pj_a2h',1);this.parentNode.remove()" aria-label="Fermer">✕</button><b>📲 Mets « Mon tournoi » sur ton écran d’accueil</b><br>iPhone : touche <b>Partager</b> ⬆️ puis <b>Sur l’écran d’accueil</b>. Android : menu ⋮ puis <b>Ajouter à l’écran d’accueil</b>.</div>`}
/* ---------- écrans ---------- */
function vAvant(w){const T=D.T[w.t],cv=T[9]||"",p=T[w.k=="b"?1:0],pa=T[w.k=="b"?0:1],ok=T[w.k=="b"?6:5]||LS(doneK("cf")),g=poolOf(w.t),role=T[10]||"";
let h=`<div class="hero"><div class="k">TA CONVOCATION</div><div class="w">${cv?esc(cv.replace(":","h")):"Heure à venir"}</div><div class="s">${esc(fdate(D.d))}</div><div class="t">${esc(D.l||"")}</div></div>`;
h+=ok?`<div class="bt done">✅ Inscription confirmée</div>${AUTO?`<div class="nxt">👇 Voici ton tournoi : ta poule et tes horaires sont juste en dessous. Garde cette page, elle se met à jour toute seule.</div>`:""}`:`<button class="bt" id="cfb" onclick="confirmMe()">✅ Je confirme mon inscription</button><button class="bt no" onclick="noGo()">Je ne peux pas venir</button>`;
if(D.l||D.a){const q=encodeURIComponent([D.l,D.a].filter(Boolean).join(", "));h+=`<div class="box hb hv"><div class="lab"><i>📍</i>Comment venir</div><div style="font-size:18px;font-weight:800;padding-top:4px">${esc(D.l||"Le club")}</div>${D.a?`<div style="color:var(--mu);font-size:14px;margin:2px 0 12px">${esc(D.a)}</div>`:`<div style="height:10px"></div>`}<a class="bt" style="margin:0 0 8px;background:var(--ink);color:#fff" href="${mapsUrl()}" target="_blank" rel="noopener">🗺️ Itinéraire</a><div class="g2" style="margin:0"><a class="bt sec" style="margin:0" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google Maps</a><a class="bt sec" style="margin:0" href="https://waze.com/ul?q=${q}&navigate=yes" target="_blank" rel="noopener">Waze</a></div></div>`}
h+=`<button class="bt sec" onclick="ics()">📅 Ajouter à mon agenda (rappel 2 h avant)</button>`;
h+=`<div class="box hb he"><div class="lab"><i>👥</i>Ton équipe</div><div class="kv"><span>Toi</span><b>${esc(p[1]+" "+p[0])}</b></div>${pa&&pa[0]?`<div class="kv"><span>Partenaire</span><b>${esc(pa[1]+" "+pa[0])}</b></div>`:""}${role?`<div class="kv"><span>Place</span><b>${esc(role.split(" · ")[0])}</b></div>`:""}</div>`;
if(g)h+=`<div class="box hb hp"><div class="lab"><i>🎾</i>Les équipes de ta poule ${esc(g.n)} *</div>${g.r.filter(r=>r[0]!=w.t).map(r=>`<div class="kv"><span class="nm">${esc(tshort(r[0]))}</span></div>`).join("")}<p class="sm" style="margin:8px 0 0;font-size:12px">* Poules données à titre indicatif : le juge-arbitre peut les modifier jusqu’au début du tournoi (forfait, retard, remplacement).</p></div>`;
h+=infoBox();return h}
function infoBox(){const rows=[];if(D.fm)rows.push(["Format des matchs",D.fm]);if(D.wu)rows.push(["Échauffement",D.wu+" minutes"]);if(D.np)rows.push(["Pistes",D.np]);if(D.a)rows.push(["Adresse",D.a]);
return rows.length||D.ru?`<div class="box hb hs"><div class="lab"><i>💡</i>Bon à savoir</div>${rows.map(r=>`<div class="kv"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join("")}${D.ru?`<p style="margin:8px 0 0">${esc(D.ru)}</p>`:""}</div>`:""}
function vJourJ(w){const T=D.T[w.t],ar=T[w.k=="b"?4:3]||LS(doneK("ar")),x=nextOf(w);let h="";
h+=x?heroNext(w,x):`<div class="hero"><div class="k">AUJOURD’HUI</div><div class="w">${T[9]?"Convocation "+esc(T[9].replace(":","h")):"C’est le jour J"}</div><div class="s">${esc(D.l||"")}</div></div>`;
if(D.ci)h+=ar?`<div class="bt done">📍 Arrivée enregistrée</div>`:`<button class="bt" id="arb" onclick='arrived(${JSON.stringify(w)})'>📍 Je suis arrivé</button>`;
h+=poolBox(w,"Ta poule")+myRes(w)+`<div class="g2">${D.l||D.a?`<a class="bt sec" href="${mapsUrl()}" target="_blank" rel="noopener">🗺️ Itinéraire</a>`:""}<button class="bt sec" onclick="tab='pistes';draw()">📍 Les pistes</button></div>`+infoBox();return h}
function vPendant(w){const x=nextOf(w),done=!x&&myMs(w).every(z=>z.st=="f"||z.a==null||z.b==null);let h="";
if(x)h+=heroNext(w,x);else if(done)h+=`<div class="hero"><div class="k">TES MATCHS SONT TERMINÉS</div><div class="w">Merci !</div><div class="s">Suis la suite du tournoi dans l’onglet Tableau.</div></div>`;else h+=`<div class="hero"><div class="k">EN ATTENTE</div><div class="w">Ton prochain adversaire se décide</div><div class="s">L’écran se met à jour tout seul.</div></div>`;
const T=D.T[w.t];if(D.ci&&!(T[w.k=="b"?4:3]||LS(doneK("ar"))))h+=`<button class="bt" id="arb" onclick='arrived(${JSON.stringify(w)})'>📍 Je suis arrivé</button>`;
h+=poolBox(w)+myRes(w);return h}
function vApres(w){const R=(D.rk||[]).find(r=>r[0]==w.t),pl=R?R[1]:null,n=D.T.filter(T=>!T[2]&&(T[0][0]||T[1][0])).length,pts=pl&&D.pts?D.pts[pl-1]:0,med=pl==1?"🥇":pl==2?"🥈":pl==3?"🥉":"🎾";
const L=myMs(w).filter(x=>x.st=="f"),v=L.filter(x=>x.w===(x.a==w.t?0:1)).length;let jg=0,jp=0;L.forEach(x=>{const i=x.a==w.t?0:1;(x.s||"").split(" ").forEach(z=>{const q=z.split("-");if(q.length==2){jg+=+q[i]||0;jp+=+q[1-i]||0}})});
let h=`<div class="hero win"><div class="med">${med}</div><div class="w">${pl?pl+(pl==1?"er":"e")+" sur "+n:"Classement en cours"}</div>${pts?`<div class="cd">+ ${pts} points FFT</div>`:""}</div>`;
h+=`<div class="box"><div class="lab">Ton tournoi</div><div class="kv"><span>Matchs joués</span><b>${L.length}</b></div><div class="kv"><span>Victoires</span><b>${v}</b></div><div class="kv"><span>Jeux gagnés / perdus</span><b>${jg} / ${jp}</b></div></div>`;
const top=(D.rk||[]).filter(r=>r[1]&&r[1]<=3).sort((a,b)=>a[1]-b[1]);if(top.length)h+=`<div class="box"><div class="lab">Podium</div>${top.map(r=>`<div class="pod"><i>${["🥇","🥈","🥉"][r[1]-1]}</i><span class="nm">${esc(tshort(r[0]))}</span></div>`).join("")}</div>`;
h+=myRes(w);if((D.cal||[]).length)h+=`<div class="box"><div class="lab">Prochains tournois du club</div>${D.cal.map(c=>`<div class="kv"><span>${esc(fdate(c[0]))}</span><b>${esc(c[1])}</b></div>`).join("")}</div>`;
return h}
function vTableau(w){const B=D.M.filter(x=>!x.g),P=D.G||[];if(!sub){const known=B.some(x=>x.a!=null&&x.a>=0&&x.b!=null&&x.b>=0),mp=w?P.findIndex(g=>g.r.some(r=>r[0]==w.t)):-1;sub=known||!P.length?"tab":"P"+Math.max(0,mp)}let h=`<div class="sbt">${B.length?`<button class="${sub=="tab"?"on":""}" onclick="sub='tab';draw()">🏆 Tableau</button>`:""}${P.map((g,i)=>`<button class="${sub=="P"+i?"on":""}" onclick="sub='P${i}';draw()">Poule ${esc(g.n)}</button>`).join("")}</div>`;
if(sub[0]=="P"){const g=P[+sub.slice(1)];if(g){const t0=w?w.t:-1;h+=`<div class="box"><div class="lab">Poule ${esc(g.n)}</div><table><colgroup><col style="width:9%"><col><col style="width:10%"><col style="width:10%"><col style="width:13%"><col style="width:12%"></colgroup><tr><th></th><th class="l">Équipe</th><th>J</th><th>V</th><th>+/-</th><th>Pts</th></tr>${g.r.map((r,k)=>`<tr class="${r[0]==t0?"me":""}${r[5]?" q":""}"><td>${k+1}</td><td class="l"><span class="nm">${esc(tshort(r[0]))}</span></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]>0?"+"+r[3]:r[3]}</td><td><b>${r[4]}</b></td></tr>`).join("")}</table></div>`;h+=D.M.filter(x=>x.g&&x.l.indexOf("Poule "+g.n)==0).map(x=>mcard(x,w)).join("")}return h}
if(!B.length)return h+`<div class="box"><p>Le tableau apparaîtra après les poules.</p></div>`;const grp={};B.forEach(x=>{const k=x.l.replace(/ \d+$/,"");(grp[k]=grp[k]||[]).push(x)});return h+(B.some(x=>x.a!=null&&x.a>=0&&x.b!=null&&x.b>=0)?"":`<div class="box"><p style="margin:0">Les noms s’afficheront dans le tableau dès la fin des poules.</p></div>`)+Object.keys(grp).map(k=>`<div class="lab" style="margin:14px 2px 8px">${esc(k)}</div>${grp[k].map(x=>mcard(x,w)).join("")}`).join("")}
function mcard(x,w){const mine=w&&(x.a==w.t||x.b==w.t),sc=x.s?x.s.split(" "):[],lab=(x.st=="c"?'<span class="lv">● EN COURS</span>':x.st=="f"?"Terminé":x.h?"Vers "+esc(x.h):"")+(x.p&&x.st=="c"?" · Piste "+x.p:"");const row=(t,i)=>`<div class="mr${x.w===i?" w":""}"><div class="tm">${tname(t)}</div><span class="sc">${sc.map(s=>s.split("-")[i]).join(" ")}</span></div>`;return `<div class="m${mine?" mine":""}"><div class="mh"><span>${esc(x.l)}</span><span>${lab}</span></div>${row(x.a,0)}${row(x.b,1)}</div>`}
function vPistes(w){const np=D.np||Math.max(0,...D.M.map(x=>x.p||0));if(!np)return `<div class="box"><p>Les pistes apparaîtront dès le début du tournoi.</p></div>`;let h=`<div class="lab" style="margin:4px 2px 10px">Les pistes en direct</div>`;
for(let p=1;p<=np;p++){const cur=D.M.find(x=>x.st=="c"&&x.p==p),nx=D.M.filter(x=>x.st!="f"&&x.st!="c"&&x.p==p&&x.a!=null&&x.b!=null&&x.a>=0&&x.b>=0).sort((a,b)=>(toMin(a.h)??9999)-(toMin(b.h)??9999))[0],mine=x=>x&&w&&(x.a==w.t||x.b==w.t);
h+=`<div class="pc ${cur?"live":"free"}"><b class="p">Piste ${p}</b> <small>${cur?'<span class="lv">● en cours</span>':"libre"}</small>${cur?`<div style="margin-top:4px;font-size:14px">${mine(cur)?"<b>Toi</b> · ":""}${esc(tshort(cur.a))} <small>contre</small> ${esc(tshort(cur.b))}${cur.s?` · <b>${esc(cur.s)}</b>`:""}</div>`:""}</div>`}return h}
/* ---------- dessin ---------- */
function autoCf(){if(AUTO&&!autoT&&me&&!LS(doneK("cf"))&&(me.tok||(D&&D.tid&&me.u))){autoT=true;confirmMe()}}
function draw(){header();setTimeout(autoCf,30);const tb=$("tabs");
if(!D){if(err=="wait"||(!pid&&PL.length)){tb.style.display="none";if(!me&&PL.length>1){m.innerHTML=pickFromList();return}if(!me&&PL.length==1){me={u:PL[0][2]||"",tok:PL[0][0],n:PL[0][1]};LW(MEK,me)}
const ok=LS(doneK("cf"));m.innerHTML=`<div class="hero"><div class="k">BONJOUR ${esc((me&&me.n||"").split(" ")[0].toUpperCase())}</div><div class="w">${esc(T0||"Ton tournoi")}</div><div class="s">Toutes les infos arrivent ici avant le tournoi.</div></div>${ok?`<div class="bt done">✅ Inscription confirmée</div>${AUTO?`<div class="nxt">👇 Voici ton tournoi : ta poule et tes horaires sont juste en dessous. Garde cette page, elle se met à jour toute seule.</div>`:""}`:`<button class="bt" id="cfb" onclick="confirmMe()">✅ Je confirme mon inscription</button><button class="bt no" onclick="noGo()">Je ne peux pas venir</button>`}${a2h()}`;return}
m.innerHTML=err?`<div class="box"><h1>Pas de connexion</h1><p class="err">${esc(err)}</p><button class="bt" onclick="load(true)">🔄 Réessayer</button></div>`:"<p>Chargement…</p>";return}
let w=who();if(!w&&!me&&PL.length==1){me={u:PL[0][2]||"",tok:PL[0][0],n:PL[0][1]};LW(MEK,me);w=who()}
if(!w){tb.style.display="none";$("ph").innerHTML="";m.innerHTML=(!me&&PL.length>1)?pickFromList():pickSearch();if(me&&!w&&PL.length>1&&!PL.some(x=>x[2]&&D.T.some(T=>T[7]==x[2]||T[8]==x[2])))m.innerHTML=pickSearch();return}
if(me&&!me.tok&&PL.length){const x=PL.find(z=>z[2]&&z[2]==me.u);if(x){me.tok=x[0];LW(MEK,me)}}
const ph=phase(w),P=PH[ph];$("ph").innerHTML=`<span class="ph" style="background:${P[1]}">${P[0]}</span>`;
const showTabs=ph=="pendant"||ph=="apres"||ph=="jourj";tb.style.display=showTabs?"flex":"none";if(!showTabs)tab="moi";
tb.innerHTML=[["moi","🎾","Moi"],["tab","🏆","Tableau"],["pistes","📍","Pistes"]].map(([k,i,l])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';draw();scrollTo(0,0)"><i>${i}</i>${l}</button>`).join("");
const p=D.T[w.t][w.k=="b"?1:0],bar=`<div class="box" style="display:flex;align-items:center;gap:10px;padding:11px 14px"><span class="nm" style="flex:1;font-size:16px"><b>${esc(p[0])}</b> ${esc(p[1])}</span><button onclick="forget()" style="border:0;background:none;color:var(--mu);font-weight:800;font-family:inherit;font-size:13px;cursor:pointer">Pas moi ?</button></div>`;
let h="";if(tab=="tab")h=vTableau(w);else if(tab=="pistes")h=vPistes(w);else h=bar+(ph=="avant"?vAvant(w):ph=="jourj"?vJourJ(w):ph=="pendant"?vPendant(w):vApres(w))+a2h();
m.innerHTML=h+(last?`<div class="upd">Mis à jour à ${new Date(last).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})} · se met à jour tout seul</div>`:"")}
load(true);setInterval(()=>{if(document.visibilityState=="visible")load()},20000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible")load(true)});setInterval(()=>{if(document.visibilityState=="visible"&&D&&!document.activeElement.matches("input"))draw()},60000);
