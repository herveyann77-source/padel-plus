*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--navy);color:#e8ecff;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden}
/* entrée */
.bgp{position:fixed;inset:-10%;background:var(--photo) center/cover;filter:blur(7px) saturate(1.15);animation:kb 16s ease-in-out infinite alternate;z-index:0}
@keyframes kb{to{transform:scale(1.18) translate(-4%,3%)}}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(11,18,64,.35),rgba(11,18,64,.88) 45%,#0b1240 75%);z-index:0}
.glow{position:fixed;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(182,239,42,.32),transparent 65%);top:80px;left:-80px;animation:fl 7s ease-in-out infinite alternate;z-index:0}
@keyframes fl{to{transform:translate(140px,50px)}}
.in{position:relative;z-index:1;min-height:100vh;padding:calc(28px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:44px;height:44px;border-radius:13px;border:2px solid var(--lime)}
.logo b{font-family:var(--disp);font-size:22px;color:#fff}.logo b span{color:var(--lime)}
.hello{margin-top:auto;font-family:var(--disp);font-size:38px;line-height:1.02;color:#fff;letter-spacing:-.02em}
.hello em{font-style:normal;color:var(--lime)}
.sub{color:#c9d0f5;font-size:15px;line-height:1.45;margin:8px 0 18px}
label.f{display:block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 14px;margin-bottom:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
label.f small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mu);margin-bottom:2px}
label.f input{width:100%;border:0;background:none;color:#fff;font-size:20px;font-weight:700;outline:none;padding:2px 0;font-family:inherit;letter-spacing:.04em}
.pinw{position:relative;margin:2px 0 6px}
.pinl{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mu);margin:0 2px 6px}
.pin{display:flex;gap:10px}
.pin span{flex:1;height:58px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
.pin span.on{border-color:var(--lime)}

</style></head><body><div class="app" id="app"></div><script type="application/json" id="r255">{"src": "FFT – Les règles du Padel en 255 questions (édition 2025)", "ch": [{"n": 1, "t": "LA PISTE"}, {"n": 2, "t": "LE FILET"}, {"n": 3, "t": "LES BALLES"}, {"n": 4, "t": "LES RAQUETTES"}, {"n": 5, "t": "POSITION DES JOUEURS"}, {"n": 6, "t": "L’ÉCHAUFFEMENT ET LE RÉ-ÉCHAUFFEMENT"}, {"n": 7, "t": "DÉCOMPTE DES POINTS"}, {"n": 8, "t": "LES DELAIS"}, {"n": 9, "t": "LES CHANGEMENTS DE CÔTÉS"}, {"n": 10, "t": "LE SERVICE / LA RELANCE"}, {"n": 11, "t": "LE LET"}, {"n": 12, "t": "LA GÊNE"}, {"n": 13, "t": "L’ÉCHANGE"}, {"n": 14, "t": "LE CODE DE CONDUITE"}, {"n": 15, "t": "MÉMO : CORRECTION DES ERREURS"}], "q": [{"n": 1, "c": 1, "p": 3, "q": "Quelles sont les dimensions d’une piste de PADEL ?", "a": "C’est un rectangle de 10 m de large par 20 m de long."}, {"n": 2, "c": 1, "p": 3, "q": "Quelle doit être la hauteur libre sur toute la surface d’une piste de PADEL ?", "a": "7 m minimum pour une pratique en loisir et pour toute compétition de niveau départemental, régional ou national. Pour toutes les compétitions professionnelles européennes ou internationales : se référer au Cahier des Charges de l’Organisateur."}, {"n": 3, "c": 1, "p": 3, "q": "Combien d’accès sont recommandés sur une piste de PADEL ?", "a": "1 ou 2 accès."}, {"n": 4, "c": 1, "p": 3, "q": "Les accès à une piste de PADEL peuvent-ils comporter des portes ?", "a": "OUI. Chaque accès est composé d’une ou de deux ouverture(s), chaque ouverture pouvant disposer ou non d’une porte (qui doivent être ouvertes pendant les matchs)."}, {"n": 5, "c": 1, "p": 3, "q": "Quelle doit être la hauteur des parois de fond de terrain ?", "a": "4 m."}, {"n": 6, "c": 1, "p": 3, "q": "Les parois de fond peuvent-elles être entièrement vitrées ?", "a": "NON car le dernier mètre doit être constitué d’un grillage métallique."}, {"n": 7, "c": 1, "p": 3, "q": "Quelle doit être la hauteur des parois latérales ?", "a": "4 m sur les 2 premiers mètres depuis le fond du terrain, puis 3 m ensuite."}, {"n": 8, "c": 1, "p": 3, "q": "Est-il autorisé d’augmenter la hauteur du grillage métallique au-delà des limites prévues (par des bâches ou un filet par exemple) ?", "a": "OUI (juste pour éviter aux balles de sortir loin du terrain)."}, {"n": 9, "c": 1, "p": 3, "q": "Quelles doivent être les dimensions de chaque zone de sécurité, à l’extérieur des pistes, pour que les sorties soient autorisées ?", "a": "Il est recommandé 3m de large (une largeur de 2m peut être jugée acceptable par le Juge- Arbitre selon la configuration) par 8 m de long (centré sur l’axe du filet)."}, {"n": 10, "c": 1, "p": 3, "q": "Les poteaux latéraux peuvent-ils se situer à l’intérieur d’une piste ?", "a": "NON car le filet doit mesurer 10 m de long, comme la largeur du terrain."}, {"n": 11, "c": 1, "p": 3, "q": "Pendant l’échange, les joueurs peuvent-ils toucher les parois qui se situent de leur côté ?", "a": "OUI, que ce soit avec le corps ou avec la raquette."}, {"n": 12, "c": 1, "p": 3, "q": "Lorsque le jeu à l'extérieur du terrain est autorisé, Les joueurs peuvent-ils pendant l’échange toucher les parois qui se situent du côté de leurs adversaires ?", "a": "NON, que ce soit avec le corps ou avec la raquette et ce à partir du milieu de la piste."}, {"n": 13, "c": 1, "p": 3, "q": "Une balle rebondit sur une ligne peinte dans la continuité de la grille. Décision ?", "a": "La balle est faute car cette ligne est à l’extérieur de la piste."}, {"n": 14, "c": 2, "p": 4, "q": "Quelle doit être la hauteur du filet en son centre ?", "a": "0,88 m (une tolérance est admise de ± 0,5 cm)."}, {"n": 15, "c": 2, "p": 4, "q": "Quelle doit être la hauteur du filet à ses extrémités ?", "a": "0,92 m (une tolérance est admise de ± 0,5 cm)."}, {"n": 16, "c": 2, "p": 4, "q": "Alors qu’elle est menée 3/0 0-15 dans la première manche, la paire A/B se plaint que le filet est trop bas. Le Juge-Arbitre le vérifie et rectifie alors la hauteur. Décision ?", "a": "Les points joués restent acquis. Le jeu reprend sur le score exact.\nNote : si cette requête est faite (et fondée) après un 1er service faute alors l’interruption de jeu justifiera de rejouer un premier service."}, {"n": 17, "c": 2, "p": 4, "q": "Un joueur touche le filet avec son corps ou sa raquette. Décision ?", "a": "- Si la balle est encore en jeu alors la paire de ce joueur perd le point.\n- Si le point était acquis, il n’y a alors pas faute."}, {"n": 18, "c": 2, "p": 4, "q": "Dans quels cas un joueur peut-il frapper une balle de l’autre côté du filet, c’est-à-dire dans la moitié de terrain de son adversaire ?", "a": "- Dans le cas d’une balle dite « rétro » (balle qui repart directement de l’autre côté du filet après un rebond de son côté par suite d’un effet ou du vent).\n- Dans le cas où une balle revient dans le camp adverse après un coup ayant rebondi sur une vitre ou une grille de son propre camp."}, {"n": 19, "c": 2, "p": 4, "q": "Un joueur peut-il, après avoir frappé la balle de son côté du terrain, terminer son geste en passant le bras ou la raquette de l’autre côté du filet ?", "a": "OUI."}, {"n": 20, "c": 2, "p": 4, "q": "Emporté par sa course sur une amortie, un joueur passe le pied sous le filet sans le toucher. Est-ce une faute ?", "a": "OUI, si la balle est encore en jeu, car le joueur a mis le pied du côté de ses adversaires."}, {"n": 21, "c": 2, "p": 4, "q": "Pendant un échange, une balle doit-elle obligatoirement passer au-dessus du filet pour être bonne ?", "a": "NON, si le jeu à l'extérieur du terrain est autorisé, la balle peut être renvoyée par-dessus les parois latérales ou à côté du filet, voire même directement dans le filet du côté des adversaires.\nNote : une balle serait bonne si, après être sortie du terrain, elle revenait sur la piste sous l’action du vent (sans rien toucher et dans le cas où les sorties sont autorisées)."}, {"n": 22, "c": 3, "p": 4, "q": "Pour être homologuées, à quels types de spécificités techniques les balles doivent- elles répondre ?", "a": "- Des spécificités de diamètre, pression, de poids et de couleur."}, {"n": 23, "c": 3, "p": 4, "q": "Les balles multicolores sont-elles homologuées ?", "a": "NON."}, {"n": 24, "c": 3, "p": 4, "q": "Quelle doit être la couleur des balles pour qu’elles soient homologuées ?", "a": "Couleur uniforme, jaune ou blanche."}, {"n": 25, "c": 3, "p": 4, "q": "Quel est le nombre minimum de balles à fournir pour chaque partie ?", "a": "3 balles."}, {"n": 26, "c": 3, "p": 4, "q": "Un joueur peut-il commencer un point avec une seule balle ?", "a": "NON.\nNote : En cas de premier service faute, le serveur devra se procurer sans délai une autre balle pour ne pas interrompre le jeu entre 2 services."}, {"n": 27, "c": 3, "p": 4, "q": "Est-il obligatoire de fournir des balles neuves pour chaque partie ?", "a": "NON. Consulter le dernier guide de la compétition, les balles neuves sont obligatoires en début de tournoi et/ou à partir d’un certain niveau d’avancement du tournoi."}, {"n": 28, "c": 3, "p": 4, "q": "Les balles peuvent-elles être changées (remplacées par des balles neuves) en cours de partie ?", "a": "OUI, mais ce n’est obligatoire que si le règlement de l’épreuve le prévoit."}, {"n": 29, "c": 3, "p": 4, "q": "Quelles règles concernant la fréquence des changements de balles peuvent être appliquées pendant une partie ?", "a": "Changement de balles après un nombre de jeux impair. Changement de balles au commencement d’une manche. Dans chaque cas, l’échauffement compte pour 2 jeux et un jeu décisif pour 1 jeu."}, {"n": 30, "c": 3, "p": 4, "q": "Les balles peuvent-elles être changées avant un jeu décisif ?", "a": "NON. Il en va de même avant un super jeu décisif ou avant une manche se déroulant sous la forme d’un super jeu décisif."}, {"n": 31, "c": 3, "p": 5, "q": "Les balles n’ont pas été changées au début de la dernière manche comme cela était prévu. Décision ?", "a": "On changera les balles la prochaine fois que la paire qui aurait dû bénéficier de balles neuves sera au service."}, {"n": 32, "c": 3, "p": 5, "q": "Au premier point d’un jeu qui correspond à un changement de balles, après un premier service qui touche le filet puis qui rebondit 2 fois dans le bon \"carré\" de service, les joueurs se rendent compte que le changement de balles a été oublié. Décision ?", "a": "Le Juge-Arbitre annonce un let et procède immédiatement au changement de balles."}, {"n": 33, "c": 3, "p": 5, "q": "Au premier point d’un jeu qui correspond à un changement de balles, après un premier service qui touche le filet, tombe dans le bon \"carré\" de service puis touche la grille, les joueurs se rendent compte que le changement de balles a été oublié. Décision ?", "a": "On changera les balles la prochaine fois que la paire qui aurait dû bénéficier de balles neuves sera au service."}, {"n": 34, "c": 3, "p": 5, "q": "Quelle est la règle à appliquer en cas de perte d’une ou de plusieurs balles ?", "a": "Si une balle est perdue, cassée ou suffisamment détériorée et diffère des autres balles, le Juge-Arbitre veillera à remplacer cette balle par une autre balle se trouvant dans un état similaire à celles en jeu."}, {"n": 35, "c": 3, "p": 5, "q": "Après un échange, les joueurs s’aperçoivent que la balle utilisée n’est pas de la même marque que les autres. Décision ?", "a": "Les points joués restent acquis. La balle est remplacée par une balle de même marque et de même usure."}, {"n": 36, "c": 3, "p": 5, "q": "Une balle se crève ou éclate pendant un échange. Décision ?", "a": "On rejoue le point, la balle est remplacée par une balle de même usure."}, {"n": 37, "c": 3, "p": 5, "q": "A la fin d’un point un joueur constate que la balle utilisée manque de pression par rapport aux autres. Décision ?", "a": "Les points joués restent acquis. La balle est remplacée par une balle de même usure."}, {"n": 38, "c": 3, "p": 5, "q": "En cours d’échange, un joueur arrête le point en attrapant la balle avec la main en disant que celle-ci est crevée. Le Juge-Arbitre juge que la balle est dégonflée. Décision ?", "a": "La paire du joueur perd le point. Le point n’est à rejouer que lorsque la balle est crevée (ou suffisamment détériorée) et non simplement dégonflée."}, {"n": 39, "c": 4, "p": 6, "q": "Pour être homologuées, à quels types de spécificités techniques les raquettes doivent-elles répondre ?", "a": "Des spécificités de longueur, de largeur, d’épaisseur et de poids."}, {"n": 40, "c": 4, "p": 6, "q": "Une raquette doit-elle obligatoirement être munie d’une dragonne ?", "a": "OUI, cette dragonne ne peut pas être élastique et est de longueur limitée."}, {"n": 41, "c": 4, "p": 6, "q": "De quels éléments la raquette peut-elle être équipée ?", "a": "Seulement ceux utilisés pour limiter ou prévenir toute détérioration, vibration et visant à répartir le poids de la raquette.\nNote : Les objets doivent être raisonnables quant à leur taille et positionnement sur la raquette"}, {"n": 42, "c": 4, "p": 6, "q": "De quels éléments la raquette ne peut-elle pas être équipée ?", "a": "De surfaces réfléchissantes, d’éléments sonores ou d’éléments électroniques visant à modifier le cours normal du jeu ou à communiquer."}, {"n": 43, "c": 4, "p": 6, "q": "Un joueur peut-il commencer ou poursuivre un point avec une raquette cassée ?", "a": "OUI sauf si la cassure de la raquette rend celle-ci dangereuse ou si la dragonne est rompue. La paire de ce joueur perd alors le point si l’échange est en cours."}, {"n": 44, "c": 4, "p": 6, "q": "Un joueur peut-il utiliser plusieurs raquettes au cours d’un match ?", "a": "OUI, mais ni simultanément, ni dans le même point."}, {"n": 45, "c": 4, "p": 6, "q": "Un joueur lâche sa raquette au cours d’un point (la dragonne est toujours enroulée autour du poignet), touche la balle et la renvoie bonne. Décision ?", "a": "La paire de ce joueur perd le point."}, {"n": 46, "c": 4, "p": 6, "q": "Un joueur fait un doublé dans sa raquette et renvoie la balle bonne. Décision ?", "a": "Que le doublé soit volontaire ou non, la paire de ce joueur perd le point."}, {"n": 47, "c": 4, "p": 6, "q": "Les raquettes des 2 joueurs d’une paire s’entrechoquent au moment de frapper une balle. Décision ?", "a": "- Si une seule raquette a touché la balle alors l’échange continue.\n- Si les raquettes des 2 joueurs ont touché simultanément ou consécutivement la balle, alors cette paire perd le point."}, {"n": 48, "c": 4, "p": 6, "q": "Un joueur frappe une balle avec le manche de sa raquette. Est-ce une faute ?", "a": "NON."}, {"n": 49, "c": 4, "p": 6, "q": "Un joueur frappe une balle avec le manche de sa raquette et son pouce. Est-ce une faute ?", "a": "OUI."}, {"n": 50, "c": 5, "p": 7, "q": "Les compétitions de PADEL sont-elles autorisées en simple ou en doubles ? Lesquelles sont homologuées ?", "a": "Les compétitions se jouent exclusivement en doubles : doubles Dames ; doubles Messieurs et doubles mixtes."}, {"n": 51, "c": 5, "p": 7, "q": "Une paire peut-elle commencer un point avec un joueur se tenant à l’extérieur du terrain ?", "a": "NON, aucun joueur ne peut se trouver à l’extérieur du terrain au début d’un point."}, {"n": 52, "c": 5, "p": 7, "q": "Au début d’un point, où peut se tenir le partenaire du serveur ?", "a": "Où il veut, de son côté du filet."}, {"n": 53, "c": 5, "p": 7, "q": "Au début d’un point, où peuvent se tenir le relanceur et son partenaire ?", "a": "Où ils veulent, de leur côté du filet."}, {"n": 54, "c": 5, "p": 7, "q": "Où le serveur doit-il se tenir, au commencement d’un point ?", "a": "Le serveur doit engager le point en se positionnant derrière la ligne de service, et à gauche ou à droite du prolongement (réel ou imaginaire) de la ligne médiane de service."}, {"n": 55, "c": 5, "p": 7, "q": "Qui décide si le jeu à l'extérieur du terrain est autorisé on non ?", "a": "Le Juge-Arbitre, il prendra la décision en début de compétition. Tous les matchs d’un même tour doivent être joués dans les mêmes conditions, et si les sorties sont autorisées à partir d’un tour donné, elles le seront jusqu’à la fin du Tournoi."}, {"n": 56, "c": 5, "p": 7, "q": "L’un des deux joueurs de la paire est-il autorisé à monopoliser tout le jeu ?", "a": "OUI. Cependant, tous les joueurs doivent servir et recevoir à leur tour."}, {"n": 57, "c": 5, "p": 7, "q": "La paire A/B joue contre la paire C/D. A sert au début de la partie. La première manche se termine sur le score de 6/2. Qui doit servir au début de la deuxième manche et de quel côté ?", "a": "A ou B, les joueurs ne changent pas de côté car le cumul des jeux dans cette manche est pair."}, {"n": 58, "c": 5, "p": 7, "q": "Les joueurs de la paire A/B décident d’inverser leur place (le joueur de droite passe à gauche et inversement) pour relancer le service de la paire C/D au début de la 2ème manche. Décision ?", "a": "C’est autorisé par les règlements."}, {"n": 59, "c": 6, "p": 7, "q": "Un échauffement est-il obligatoire au PADEL, quelle est sa durée ?", "a": "OUI. Sa durée est de 5 minutes."}, {"n": 60, "c": 6, "p": 7, "q": "Que peut choisir la paire qui gagne le tirage au sort ?", "a": "Elle peut choisir :\n- de servir ou de relancer au premier jeu (la paire adverse décidera du côté) ;\n- le côté (la paire adverse décidera de servir ou de relancer) ;\n- de laisser le choix à la paire adverse (service, relance ou côté)."}, {"n": 61, "c": 6, "p": 7, "q": "La paire qui a gagné le tirage au sort peut-elle attendre la fin de l’échauffement pour donner son choix ?", "a": "Non, elle doit le faire tout de suite."}, {"n": 62, "c": 6, "p": 7, "q": "La paire qui a choisi de servir peut-elle, en cours d’échauffement, modifier son choix et demander à relancer ?", "a": "Non, le choix est définitif, sauf si les paires se mettent d’accord avant le début de la partie pour changer."}, {"n": 63, "c": 6, "p": 7, "q": "L’échauffement est interrompu par la pluie : à la reprise, le tirage au sort doit-il être refait ?", "a": "Non, mais les paires peuvent modifier leur choix (service, relance ou côté). De retour sur le terrain, la paire qui a gagné le tirage au sort décidera en premier."}, {"n": 64, "c": 6, "p": 7, "q": "Au début du deuxième jeu d’une partie, le serveur peut-il demander à servir une ou plusieurs balles d’échauffement ?", "a": "Non. L’échauffement est limité aux 5 minutes précédant le début de la partie."}, {"n": 65, "c": 6, "p": 7, "q": "Quelle est la durée du ré-échauffement après une interruption de jeu (pluie, manque de lumière, incident technique, traitement médical…) ?", "a": "- 5 minutes, sauf si la partie reprend sur le même court après une interruption inférieure à 15 minutes ou si les joueurs sont d’accord pour reprendre le jeu (il n’y a alors pas de période d’échauffement).\nNote : Si la reprise se fait sur un autre terrain, alors la durée de ré-échauffement sera de 5 min, quelle que soit la durée d’interruption. Après accord des joueurs un ré-échauffement peut être écourté ou non effectué."}, {"n": 66, "c": 6, "p": 8, "q": "Après une interruption de jeu, faut-il utiliser les balles du match pour un éventuel ré- échauffement ?", "a": "Non, des balles d’usure identique à celles du match doivent être utilisées pour le ré- échauffement, puis remplacées par les balles du match à la fin du ré-échauffement."}, {"n": 67, "c": 7, "p": 8, "q": "Quel est le décompte des points au PADEL ?", "a": "C’est le même qu'au TENNIS : « 15 » lorsqu’une paire gagne un point, « 30 » lorsqu’elle gagne un second point dans le jeu, « 40 » pour le gain d’un troisième point. La règle du « point décisif » peut - ou non - s’appliquer à 40 partout au lieu de la règle de l’avantage."}, {"n": 68, "c": 7, "p": 8, "q": "Comment l’application de la règle du point décisif se traduit-elle ?", "a": "A « égalité » (40 partout), la paire recevant choisit de quel côté le point sera engagé. Les relanceurs ne peuvent pas changer de position pour recevoir ce point décisif. La paire qui remporte le point décisif gagne le jeu.\nNote : En Mixte : le relanceur doit être du même sexe que le serveur."}, {"n": 69, "c": 7, "p": 8, "q": "Comment l’application de la règle de l’avantage se traduit-elle ?", "a": "En cas d’égalité à 40/40, le point suivant remporté sera appelé « Avantage » : soit la paire qui vient de remporter l’Avantage gagne alors le point suivant et s’adjuge le gain du jeu, soit la paire adverse remporte le point suivant, et auquel cas on revient à 40/40, et ainsi de suite jusqu’à ce qu’une paire gagne deux points consécutifs et s’adjuge le jeu."}, {"n": 70, "c": 7, "p": 8, "q": "Combien existe-il de format de jeu au PADEL ? Lesquels ?", "a": "Il existe 9 formats de jeu pour les compétitions homologuées FFT :\n- Format A1 : traditionnel, 3 sets à 6 jeux\n- Format A2 : 3 sets à 6 jeux avec point décisif\n- Format B1 : 2 sets à 6 jeux / 3ème set = super jeu décisif à 10 points\n- Format B2 : 2 sets à 6 jeux / 3ème set = super jeu décisif à 10 points, avec point décisif\n- Format C1 : 2 sets à 4 jeux (jeu décisif à 4/4) / 3ème set = super jeu décisif à 10 points\n- Format C2 : 2 sets à 4 jeux / 3ème set = super jeu décisif à 10 points, avec point décisif (jeu décisif à 4/4)\n- Format D1 : 1 set à 9 jeux (jeu décisif à 8/8)\n- Format D2 : 1 set à 9 jeux (jeu décisif à 8/8) avec point décisif\n- Format E : 1 set à 10 points (format réservé aux tournois P 25)"}, {"n": 71, "c": 7, "p": 8, "q": "Quelle est la différence entre un Jeu Décisif et un Super Jeu Décisif ?", "a": "- Jeu Décisif : La paire arrivant la première à 7 points avec deux points d’écart remportera la manche (en cas d’égalité à 6 points partout, le jeu décisif continuera jusqu’à ce qu’une paire obtienne 2 points d’écart).\n- Super Jeu Décisif : La paire arrivant la première à 10 points avec deux points d’écart remportera la manche"}, {"n": 72, "c": 8, "p": 9, "q": "De quel délai dispose une paire pour se présenter sur le terrain ?", "a": "10 minutes après l’heure de convocation.\nNote : Passé ce délai, la paire dont un joueur (au moins) est manquant, sera déclarée forfait par le Juge-Arbitre, sauf si ce dernier considère qu’il s’agit d’un cas de force majeure ; auquel cas il laissera un délai raisonnable au(x) joueur(s) pour se présenter."}, {"n": 73, "c": 8, "p": 9, "q": "Quand les parties sont programmées les unes après les autres (programmation du type « à suivre »), quel est le délai accordé après la fin du match précédent ?", "a": "5 minutes."}, {"n": 74, "c": 8, "p": 9, "q": "Quel est le délai accordé entre 2 points ?", "a": "Aucun. Le jeu doit être continu. À l’appréciation de l’arbitre, le joueur pourra être sanctionné dans le cadre du Code fédéral de conduite si le dépassement est jugé volontaire ou dans le cadre de la procédure de dépassement de temps non intentionnel (avertissement, point, point, point, etc.) si le dépassement est jugé involontaire..."}, {"n": 75, "c": 8, "p": 9, "q": "Quel est le délai accordé entre 2 services ?", "a": "Aucun, le jeu doit être continu."}, {"n": 76, "c": 8, "p": 9, "q": "Quel est le délai accordé à chaque changement de côté ?", "a": "- 90 secondes de repos maximum peuvent être prises à chaque changement de côté.\n- Après le 1er jeu de chaque manche ou durant un jeu décisif ou super jeu décisif, le jeu sera continu et les joueurs changeront de côté sans aucun repos.\n- Deux minutes de repos sont autorisées à chaque fin de manche.\nNote : Ces délais sont accordés entre la fin du dernier point et le début du point suivant."}, {"n": 77, "c": 8, "p": 9, "q": "Un joueur est victime d’une blessure accidentelle. A-t-il droit à une interruption de la partie ?", "a": "- Oui, il a droit à 3 minutes d’interruption, éventuellement cumulables avec la minute 30 accordée au changement de côté ou aux 2 minutes si c’est à la fin d’une manche. Le joueur blessé doit immédiatement préciser s’il désire prendre ses 3 minutes pour recevoir des soins ou s’il préfère attendre le changement de côté.\n- En cas de saignement, le traitement médical peut être étendu jusqu’à 5 minutes."}, {"n": 78, "c": 8, "p": 9, "q": "De combien d’interventions au maximum un joueur peut-il bénéficier pour une même blessure ?", "a": "- Trois :\n• un traitement médical de 3 minutes ;\n• le temps de deux changements de côté. Nota : Ces 3 interventions peuvent être prises dans n’importe quel ordre et à n’importe quel moment de la partie"}, {"n": 79, "c": 8, "p": 9, "q": "Un joueur vient de bénéficier d’un soin de 3 minutes, son partenaire, qui ne s’est pas fait traiter, peut-il lui « donner » son soin de 3 minutes ?", "a": "NON. Les soins se comptabilisent par joueur."}, {"n": 80, "c": 8, "p": 9, "q": "Un joueur qui a déjà bénéficié d’un soin de 3 minutes pour une blessure au poignet se blesse à la cheville. A-t-il droit à un autre soin de 3 minutes ?", "a": "OUI. Chaque nouvelle blessure ou aggravation sur le terrain d’une blessure existante peut donner lieu à un soin de 3 minutes."}, {"n": 81, "c": 8, "p": 9, "q": "Sur quel score un Juge-Arbitre peut-il décider de stopper une partie à cause de la lumière pour ne la faire reprendre que le lendemain ou sur un autre terrain éclairé ?", "a": "Il faudra stopper la partie sur une somme paire de jeux dans cette manche."}, {"n": 82, "c": 8, "p": 9, "q": "Une partie est stoppée. Sur quel score reprendra-t-elle ?", "a": "Le jeu devra reprendre exactement là où il s’est arrêté : même score, même serveur, même camp pour chaque paire.\nNote : Si l’interruption a eu lieu après un premier service faute, alors la partie reprendra sur un premier service."}, {"n": 83, "c": 8, "p": 9, "q": "Quel délai est accordé à un joueur si ses vêtements, ses chaussures doivent être remplacés car ils se sont détériorés sur le terrain, ou pour toute circonstance indépendante de la volonté du joueur ?", "a": "Un délai raisonnable lui sera accordé pour trouver une solution."}, {"n": 84, "c": 8, "p": 9, "q": "Quel délai est accordé à un joueur pour remplacer sa raquette ?", "a": "Aucun, le joueur devra respecter la continuité du jeu. Il pourra éventuellement sortir du terrain pour aller en chercher une autre.\nNote : en cas de dépassement de temps, le Juge-Arbitre appliquera le code de conduite par période de 30 secondes."}, {"n": 85, "c": 8, "p": 10, "q": "Pendant un changement de côté, un joueur souhaite changer son short car il ne se sent pas à l’aise avec. Décision ?", "a": "Aucun délai supplémentaire ne lui sera accordé, le joueur doit respecter le temps de changement de côté pour se changer.\nNote : Il s’agit cette fois d’un changement de confort. Il peut également se changer sur place le temps d’un changement de côté."}, {"n": 86, "c": 8, "p": 10, "q": "Un joueur porte des lunettes au début d’un match ; à la fin de la première manche, il commence à pleuvoir très légèrement sans que cela nécessite d’interrompre la partie. Le joueur demande alors une interruption de jeu pour mettre les lentilles de contact qu’il a dans son sac en remplacement de ses lunettes. Décision ?", "a": "Le joueur bénéficie d’un temps raisonnable pour le faire."}, {"n": 87, "c": 8, "p": 10, "q": "En relaçant sa chaussure, un joueur casse un lacet : a-t-il droit à une interruption de jeu pour réparer les dégâts ?", "a": "Oui, on lui accorde, comme pour tout incident matériel, un temps raisonnable pour réparer les dégâts."}, {"n": 88, "c": 8, "p": 10, "q": "Un joueur est victime de crampes (officiellement diagnostiquées) ou de toute autre perte naturelle de condition physique. A-t-il droit à une interruption de la partie ?", "a": "NON, le jeu doit se poursuivre. En cas de non-respect de cette règle, la paire est sanctionnée dans le cadre du Code de conduite par période de 30 secondes."}, {"n": 89, "c": 8, "p": 10, "q": "Le soigneur est appelé sur le terrain. Après l’évaluation de la blessure, le soigneur demande que le traitement se fasse dans les vestiaires. Il quitte le terrain avec le joueur et le Juge-Arbitre. À quel moment débutera l’interruption de jeu de 3 minutes, et qui est responsable du contrôle du temps ?", "a": "C’est le Juge-Arbitre qui assurera le contrôle du temps des soins. Les 3 minutes sont décomptées quand le soigneur a préparé son matériel et commence les soins."}, {"n": 90, "c": 8, "p": 10, "q": "Une partie est interrompue, les joueurs quittent le terrain. Peuvent-ils au cours de l’interruption recevoir des soins ou des conseils ?", "a": "OUI, les soins ne seront pas comptabilisés et le coaching est autorisé."}, {"n": 91, "c": 8, "p": 10, "q": "Un joueur peut-il être autorisé à sortir du terrain pour aller aux toilettes ?", "a": "Oui, le joueur est autorisé à quitter le terrain pour se rendre aux toilettes 2 fois par partie (échauffement compris), de préférence à la fin d’une manche. Il bénéficie pour cela d’un temps raisonnable. Il doit être accompagné pour qu’il ne puisse recevoir ni soins ni conseils. Le nombre de sorties toilettes est cependant limité à 2 par paire par partie. Si les 2 joueurs sortent en même temps, cela ne compte que comme une sortie toilette. Dans la mesure du possible, un joueur susceptible d’être malade en cours de partie doit prévenir avant la partie le Juge-Arbitre."}, {"n": 92, "c": 8, "p": 10, "q": "Un joueur a atteint le nombre maximum de sorties toilette autorisées, il demande de nouveau de sortir au Juge-Arbitre. Décision ?", "a": "- Le joueur peut être autorisé à quitter le terrain, mais il ne bénéficiera que du temps du changement de côté pour le faire.\n- S’il n’est pas revenu dans les temps, la procédure de dépassement de temps non intentionnel s’applique (avertissement, point, point, point, etc.) par périodes de 30 secondes.\nNote : Le Juge-Arbitre pourra refuser toute sortie supplémentaire s’il estime que cela nuit à l’esprit du jeu."}, {"n": 93, "c": 8, "p": 10, "q": "Un joueur demande à aller aux toilettes au milieu d’une manche. Décision ?", "a": "Il doit attendre la pause de fin de manche pour aller aux toilettes. S’il s’agit d’une urgence, le Juge-Arbitre l’autorisera exceptionnellement à quitter le terrain, de préférence avant son jeu de service. Il bénéficiera pour cela d’un temps raisonnable."}, {"n": 94, "c": 8, "p": 11, "q": "Une partie reprend après 16 minutes d’interruption suite à l’intervention d’un soigneur (11 minutes pour venir, 2 minutes de diagnostic et 3 minutes de soins). A combien de temps de ré-échauffement les joueurs ont-ils droit ?", "a": "5 minutes."}, {"n": 95, "c": 8, "p": 11, "q": "Un joueur victime de crampes peut-il être massé par son partenaire ?", "a": "Oui, sous réserve du respect de la règle de continuité du jeu."}, {"n": 96, "c": 8, "p": 11, "q": "Aucune des 2 paires ne respecte la règle de continuité du jeu entre 2 points, la responsabilité des 2 paires étant engagée. Décision ?", "a": "C’est la paire du serveur qui doit être pénalisée."}, {"n": 97, "c": 9, "p": 11, "q": "Quand les changements de côtés à la fin d’un jeu ou d’une manche se font-ils ?", "a": "Quand la somme des jeux disputés dans la manche est impaire."}, {"n": 98, "c": 9, "p": 11, "q": "Les joueurs doivent-ils changer de côté à la fin d’un Jeu Décisif ?", "a": "OUI, puisque le jeu décisif compte pour 1 jeu, le total sera de 13 jeux dans cette manche."}, {"n": 99, "c": 9, "p": 11, "q": "Au cours d’un Jeu Décisif, ou d’un Super Jeu Décisif, quand les joueurs doivent-ils changer de côté ?", "a": "Tous les 6 points."}, {"n": 100, "c": 9, "p": 11, "q": "Une manche se termine sur le score de 7/0 au jeu décisif. Les joueurs viennent de changer de côte pendant le Jeu Décisif. Doivent-ils encore changer de côté pour débuter la manche suivante ?", "a": "OUI, car le cumul des jeux de la manche est impair.\nNote : Le changement de côté après un Jeu Décisif se fait toujours par rapport à la dernière position des joueurs."}, {"n": 101, "c": 9, "p": 11, "q": "Les joueurs s’aperçoivent à 30/0 qu’ils ont oublié de changer de côté. Décision ?", "a": "Les joueurs changent de côté immédiatement, les points joués restent acquis."}, {"n": 102, "c": 9, "p": 11, "q": "Les joueurs s’aperçoivent à 4/3 et 15/0 et après un premier service faute qu’ils ont oublié de changer de côté. Décision ?", "a": "Les joueurs changent de côté immédiatement sans délais supplémentaire, les points joués restent acquis. Le serveur n’aura droit qu’à un second service.\nNote : Il est de la responsabilité du serveur de s’assurer qu’il sert du bon côté."}, {"n": 103, "c": 9, "p": 11, "q": "Les joueurs ont oublié de changer de côté, au cours d’un jeu décisif, après 6 points, et l’erreur est découverte après 8 points. Décision ?", "a": "Les joueurs doivent alors changer de côté. Le changement de côté suivant sera effectué, normalement, après 12 points."}, {"n": 104, "c": 10, "p": 12, "q": "Quelle est l’alternance des services au cours d’un jeu décisif ?", "a": "Le premier serveur sert un point (à droite), puis les paires servent 2 points chacune (à gauche, puis à droite) en respectant l’ordre des services."}, {"n": 105, "c": 10, "p": 12, "q": "A combien de services chaque joueur a-t-il droit ?", "a": "2 services, si les 2 services sont fautes, alors la paire au service perd le point."}, {"n": 106, "c": 10, "p": 12, "q": "Une balle peut-elle être servie dans n’importe quelle direction ?", "a": "NON. La balle doit être servie dans la diagonale opposée, en direction du carré de service adverse."}, {"n": 107, "c": 10, "p": 12, "q": "Comment un service doit-il s’effectuer ?", "a": "Il doit s’effectuer « à la cuillère », après rebond au sol, à hauteur de ceinture ou en dessous. Le rebond doit être effectué dans la moitié de terrain du serveur et obligatoirement derrière la ligne de service."}, {"n": 108, "c": 10, "p": 12, "q": "Avant un service, le serveur peut-il faire rebondir la balle plusieurs fois au sol, où il veut, pour préparer son service ?", "a": "OUI. Seul le dernier rebond devra être effectué à l’extérieur du carré de service et dans la bonne moitié du terrain."}, {"n": 109, "c": 10, "p": 12, "q": "Le serveur peut-il, avant de servir un 1er service, choisir les balles qu’il va utiliser ?", "a": "Oui, à condition que cela n’entraîne pas une violation de la règle de la règle de continuité de jeu."}, {"n": 110, "c": 10, "p": 12, "q": "Un joueur peut-il commencer de servir un point avec une raquette cassée ?", "a": "Oui, sauf si la cassure la rend dangereuse ou si la dragonne est rompue"}, {"n": 111, "c": 10, "p": 12, "q": "Comment un service est-il effectué correctement ?", "a": "- Pour engager le point, les deux pieds du serveur doivent se trouver derrière la ligne de service (ligne parallèle au filet), et entre la prolongation de la ligne centrale (perpendiculaire au filet) et la vitre latérale. Le serveur ne doit donc en aucun cas toucher la ligne de service, ni la prolongation (réelle ou imaginaire) de la ligne médiane de service avec l’un de ses pieds.\n- Au moment de la frappe, le serveur doit avoir au moins un pied au sol.\n- Pour servir, le joueur ne pourra ni marcher, ni courir, ni sauter. Le non-respect d’au moins un de ces points sera considéré comme une faute de pied.\nNote : Tous les petits mouvements du pied qui n’affectent pas la position de service adoptée sont acceptés."}, {"n": 112, "c": 10, "p": 13, "q": "Au moment où il lâche sa balle, le serveur a un pied derrière la mauvaise moitié du terrain ; puis, avant de frapper la balle, il ramène son pied derrière la bonne moitié du terrain. Le service est-il correct ?", "a": "Non, car le serveur a un pied derrière la mauvaise moitié du terrain alors que le service est commencé."}, {"n": 113, "c": 10, "p": 13, "q": "Le Juge-Arbitre, le superviseur, constate que le serveur a un pied sur la ligne au moment où il lâche sa balle au service, puis il place correctement son pied au moment de la frappe et délivre un service qui tombe dans le bon « carré » de service. Décision ?", "a": "Il doit annoncer faute de service dès que le serveur a frappé la balle."}, {"n": 114, "c": 10, "p": 13, "q": "Une fois la balle servie, elle rebondit sur une paroi située du côté du serveur avant de passer le filet puis tombe dans le bon « carré » de service. Ce service est-il correct ?", "a": "NON."}, {"n": 115, "c": 10, "p": 13, "q": "Un joueur se baisse pour servir et sert quand la balle est au-dessus de sa ceinture, mais s’il était resté droit, la balle serait en dessous de sa ceinture. Décision ?", "a": "C’est une faute de service."}, {"n": 116, "c": 10, "p": 13, "q": "Un joueur manque la balle en essayant de servir. Décision ?", "a": "C’est une faute de service."}, {"n": 117, "c": 10, "p": 13, "q": "Un service tombe dans le bon « carré » de service puis touche une grille. Décision ?", "a": "Il y a faute de service."}, {"n": 118, "c": 10, "p": 13, "q": "Un service tombe dans le bon « carré » de service puis touche une vitre. Décision ?", "a": "Le point continue."}, {"n": 119, "c": 10, "p": 13, "q": "Un service rebondit 2 fois dans le bon « carré » de service avant d’être renvoyé de l’autre côté par le relanceur, la balle n’a rien touché d’autre avant le premier rebond au sol. Décision ?", "a": "Point pour la paire au service, c’est un ace."}, {"n": 120, "c": 10, "p": 13, "q": "Au service, une balle touche le filet (ou un des poteaux soutenant le filet), le franchit, tombe dans le bon « carré » de service opposé, sans sortir de la piste. Décision ?", "a": "- Si la balle rebondit une seconde fois dans le terrain adverse ou sur une paroi vitrée alors le service est LET et est à rejouer ;\n- Si la balle touche directement la grille, alors le service est faute."}, {"n": 121, "c": 10, "p": 13, "q": "Une balle de service touche le filet (ou un des poteaux soutenant le filet, y compris sa protection éventuelle), le franchit, et touche directement le relanceur ou son partenaire alors que ceux-ci se tiennent en dehors du carré de service. Décision ?", "a": "Le service est LET et est à rejouer.\nNote : s’il s’agit d’un second service, on ne rejoue que le second service."}, {"n": 122, "c": 10, "p": 14, "q": "Au service, une balle touche le filet (ou un des poteaux soutenant le filet, y compris sa protection éventuelle), le franchit, tombe dans le bon « carré » de service opposé et sort par la porte. Décision ?", "a": "- Le service est LET et à rejouer si le jeu à l'extérieur du terrain est autorisé.\n- Le service est faute si les sorties ne sont pas autorisées."}, {"n": 123, "c": 10, "p": 14, "q": "Une balle de service tombe dans le bon « carré » puis touche le poteau entre la vitre et le grillage. Décision ?", "a": "Il y a faute de service."}, {"n": 124, "c": 10, "p": 14, "q": "Le serveur est manifestement gêné à l’instant où il frappe sa seconde balle par un spectateur qui hurle et il fait une faute. Décision ?", "a": "Double faute ; point à la paire du relanceur (gêne extérieure)."}, {"n": 125, "c": 10, "p": 14, "q": "En servant une première balle de service faute, le serveur casse sa raquette. Après l’avoir changée, a-t-il droit à un premier ou à un second service ?", "a": "Un second service."}, {"n": 126, "c": 10, "p": 14, "q": "Au cours d’un service, la raquette du serveur s’échappe de ses mains et atterrit dans le filet après que le relanceur a raté son retour. Décision ?", "a": "La paire du serveur perd le point puisqu’un joueur ne peut lâcher sa raquette au cours d’un point."}, {"n": 127, "c": 10, "p": 14, "q": "Au moment où le serveur commence son geste, le relanceur sautille et bouge : en a- t-il le droit ?", "a": "- Oui, si ses mouvements ont pour seul but de lui permettre de mieux rentrer dans l’échange.\n- Non, s’ils ont pour but de gêner l’adversaire dans l’exécution du service. Par exemple, le relanceur peut sautiller, mais pas taper des pieds."}, {"n": 128, "c": 10, "p": 14, "q": "En retournant un premier service faute, le relanceur casse sa raquette. Doit-il la changer pour retourner le second service ? Quelle est la conséquence pour le serveur ?", "a": "Le relanceur n’est pas obligé de changer de raquette sauf si la cassure la rend dangereuse ou si la dragonne est cassée. S’il le fait, le serveur bénéficie d’un premier service."}, {"n": 129, "c": 10, "p": 14, "q": "Une balle venue d’un terrain voisin suite à un smash arrive sur le terrain au moment où le serveur se prépare à servir une seconde balle : a-t-il droit à un 1er service ?", "a": "Non, car il n’a pas été gêné dans l’exécution de son second service."}, {"n": 130, "c": 10, "p": 14, "q": "Quand peut-on changer l’ordre des relanceurs ou des serveurs ?", "a": "Uniquement au début de chaque manche."}, {"n": 131, "c": 10, "p": 14, "q": "On s’aperçoit au cours d’un jeu que le service n’a pas été délivré par le bon serveur (que ce soit par le partenaire du serveur ou par un de ses adversaires). Décision ?", "a": "Les points restent acquis, on rectifie l’erreur. Si l’erreur est découverte après un 1er service faute, alors la faute de service :\n- Est maintenue si le service a été délivré par le partenaire du serveur\n- Est annulée si le service a été délivré par ses adversaires.\nNote : si les joueurs ont oublié de changer de côté après un 1er service faute, alors cette faute de service sera maintenue uniquement si la bonne paire était au service."}, {"n": 132, "c": 10, "p": 14, "q": "On s’aperçoit à la fin d’un jeu que les serveurs ont échangé leur position. Décision ?", "a": "Les points restent acquis. L’inversion est alors maintenue jusqu’à la fin de la manche.\nNote : s’il s’agissait d’un jeu décisif, chaque paire sera libre de choisir l’ordre des serveurs."}, {"n": 133, "c": 10, "p": 14, "q": "On s’aperçoit au cours d’un jeu ou d’un Jeu Décisif que les relanceurs ont échangé leur position. Décision ?", "a": "Les points restent acquis. On maintient l’erreur jusqu’à la fin du jeu. L’erreur sera rectifiée la prochaine fois que cette paire sera à la relance."}, {"n": 134, "c": 10, "p": 14, "q": "On s’aperçoit que le service a été délivré depuis la mauvaise moitié du terrain. Décision ?", "a": "Les points restent acquis, on rectifie l’erreur. Si l’erreur est découverte après un 1er service faute, alors la faute de service est maintenue."}, {"n": 135, "c": 10, "p": 14, "q": "Le serveur manque complètement son service en lob, la balle sort latéralement du côté du terrain mais retombe bonne de l’autre côté du filet suite à une rafale de vent. Décision ?", "a": "Il y a faute de service car la balle n’est pas passée au-dessus du filet.\nNote : si les sorties ne sont pas autorisées, la balle est faute dès lors qu’elle franchit la grille ou vitre latérale de son propre terrain."}, {"n": 136, "c": 10, "p": 14, "q": "Une balle de service touche directement le partenaire du serveur. Décision ?", "a": "Il y a faute de service."}, {"n": 137, "c": 10, "p": 14, "q": "Une balle de service touche directement le relanceur ou son partenaire, sans autre rebond. Décision ?", "a": "Il y a point pour la paire du serveur."}, {"n": 138, "c": 10, "p": 15, "q": "Le relanceur n’est pas prêt au moment où le serveur sert un 2ème service, le relanceur n’essaye pas de retourner. Décision ?", "a": "Second service à rejouer. C’est au serveur de vérifier que le relanceur est prêt."}, {"n": 139, "c": 10, "p": 15, "q": "Le relanceur qui n’était pas prêt retourne dans le filet. Décision ?", "a": "Point pour la paire du serveur, car le relanceur a tenté de relancer."}, {"n": 140, "c": 10, "p": 15, "q": "Le relanceur signale qu’il n’est pas prêt après que le serveur a commencé son geste de seconde balle de service qui tombe dans le filet. Décision ?", "a": "LET, 1er service à rejouer."}, {"n": 141, "c": 10, "p": 15, "q": "Le relanceur signale qu’il n’est pas prêt avant que le serveur n’ait commencé son geste de seconde balle de service. Décision ?", "a": "Second service à rejouer."}, {"n": 142, "c": 10, "p": 15, "q": "Le relanceur retourne un service en envoyant la balle sur une vitre de son côté, surpris le partenaire de serveur arrête la balle à la main. Décision ?", "a": "Point gagné par la paire du relanceur, ce retour est parfaitement valable."}, {"n": 143, "c": 10, "p": 15, "q": "Le relanceur retourne un service en envoyant la balle sur une grille de son côté, surpris le partenaire de serveur arrête la balle à la main. Décision ?", "a": "Point gagné par la paire du serveur, ce retour n’est pas valable"}, {"n": 144, "c": 10, "p": 15, "q": "Le relanceur renvoie directement un service de volée. Décision ?", "a": "Il y a point pour la paire du serveur."}, {"n": 145, "c": 10, "p": 15, "q": "Le relanceur ne peut retourner un service mais son partenaire y parvient. Décision ?", "a": "Il y a point pour la paire du serveur."}, {"n": 146, "c": 10, "p": 15, "q": "Le service est délivré correctement et le relanceur le renvoie après un 1er rebond sur la vitre latérale et un 2ème rebond sur la vitre de fond. Décision ?", "a": "Le point continue."}, {"n": 147, "c": 10, "p": 15, "q": "Qui doit servir le premier point du Jeu Décisif ?", "a": "La paire qui a relancé au cours du jeu précédant le jeu décisif. L’ordre des serveurs doit être respecté."}, {"n": 148, "c": 10, "p": 15, "q": "Qui doit servir le premier point du Super Jeu Décisif ?", "a": "La paire qui a relancé le premier point du jeu précédent. Elle choisit son serveur, comme à chaque début de manche."}, {"n": 149, "c": 10, "p": 15, "q": "Qui doit servir au début d’une manche après un Jeu Décisif ?", "a": "La paire qui a relancé le premier point du jeu décisif. Elle choisit son serveur, comme à chaque début de manche."}, {"n": 150, "c": 10, "p": 15, "q": "Le joueur A effectue un premier service très court qui ne touche pas le filet puis après un 1er rebond correct sort par la porte. Décision ?", "a": "- Si le jeu à l'extérieur du terrain est autorisé : le point continue\n- Si les sorties ne sont pas autorisées : c’est une faute de service."}, {"n": 151, "c": 10, "p": 15, "q": "Après avoir fait rebondir la balle au sol, le serveur décide de ne pas la frapper et la reprend dans la main ou sur la raquette. Est-ce une faute de service ?", "a": "NON"}, {"n": 152, "c": 10, "p": 15, "q": "Au cours d’un jeu décisif, un joueur a servi à la place de son partenaire. Décision ?", "a": "Si l’erreur est découverte :\n- Après le premier point du jeu décisif, ou après qu’un joueur a servi par erreur une séquence de 2 points, l’alternance erronée des séquences de 2 points doit être maintenue jusqu’à la fin du jeu ;\n- Après qu’un joueur a servi par erreur un seul point d’une séquence de 2, l’alternance doit être corrigée immédiatement, le point joué restant acquis. Celui qui aurait dû servir ne servira alors qu’un point au lieu de 2."}, {"n": 153, "c": 11, "p": 16, "q": "Qu’est-ce qu’un LET pendant l’échange ?", "a": "C’est le fait de devoir rejouer intégralement un point suite à certaines situations."}, {"n": 154, "c": 11, "p": 16, "q": "Quelles sont les situations pouvant entraîner un LET pendant un échange ?", "a": "- La balle éclate pendant un échange.\n- Un élément externe au jeu envahit la surface de jeu pendant un échange.\n- Il y a une situation imprévue qui interrompt le jeu."}, {"n": 155, "c": 11, "p": 16, "q": "Qu’est-ce qu’un service LET ?", "a": "C’est le fait de devoir rejouer la balle de service en question (1ère ou 2nde balle)."}, {"n": 156, "c": 11, "p": 16, "q": "Une seconde balle de service est déclarée LET. Décision ?", "a": "Seule la seconde balle est à rejouer."}, {"n": 157, "c": 11, "p": 16, "q": "Quelles sont les situations pouvant entraîner un service LET ?", "a": "- Lorsque, après avoir touché le filet, le poteau de filet (y compris sa protection éventuelle) ou la bande :\n* la balle tombe dans le bon carré de service puis effectue un second rebond au sol ou sur une vitre. * la balle tombe dans le bon carré de service puis touche le relanceur (ou son partenaire), ou son équipement. * la balle touche directement le relanceur (ou son partenaire), ou son équipement. * si le jeu à l'extérieur du terrain est autorisé, la balle tombe dans le bon carré de service puis passe par l’ouverture de la porte.\n- Lorsque le serveur a servi alors que le relanceur (ou son partenaire) n’était pas prêt."}, {"n": 158, "c": 11, "p": 16, "q": "Un joueur considère qu’une situation entrainant un LET s’est produite durant un échange, stoppe le jeu et appelle le Juge-Arbitre. Décision ?", "a": "- Soit le Juge-Arbitre valide le LET.\n- Si, en revanche, le Juge-Arbitre estime qu’il n’y avait pas lieu à interrompre le cours du jeu, la paire du joueur s’étant arrêté aura point perdu."}, {"n": 159, "c": 11, "p": 16, "q": "Un serveur rate son premier service, puis une situation imprévue justifiant un LET interrompt la réalisation du second service. Décision ?", "a": "LET, 1er service à rejouer."}, {"n": 160, "c": 11, "p": 16, "q": "Une situation imprévue justifiant un LET interrompt un point suite à un second service réalisé par le serveur. Décision ?", "a": "LET, 1er service à rejouer."}, {"n": 161, "c": 11, "p": 16, "q": "Une situation imprévue justifiant un LET interrompt un point entre les 2 services et avant que le serveur ne commence son geste de second service. Décision ?", "a": "Second service à jouer car le joueur n’a pas été gêné pendant le déroulement du service."}, {"n": 162, "c": 11, "p": 16, "q": "Un spectateur hurle « faute » en cours d’échange. Décision ?", "a": "En règle générale, il n’y a pas lieu d’annoncer un let. Si toutefois le Juge-Arbitre estime que les 2 paires ont été gênées, que cette gêne a eu une influence sur le déroulement de l’échange et qu’aucune paire ne peut être lésée par cette annonce, il peut prononcer un let."}, {"n": 163, "c": 11, "p": 16, "q": "Un doublé involontaire dans la raquette doit-il entraîner un LET ?", "a": "Non, la paire du joueur auteur du doublé involontaire perd le point."}, {"n": 164, "c": 11, "p": 16, "q": "En cours d’échange, un joueur se rend compte qu’il a servi de la mauvaise moitié du terrain et arrête la balle de la main. Il réclame un LET. Décision ?", "a": "La paire de ce joueur perd le point. Le point suivant sera servi conformément au score."}, {"n": 165, "c": 11, "p": 16, "q": "En cours d’échange, une balle tombe de la poche d’un joueur. Décision ?", "a": "- La première fois, l’arbitre annonce un let et préviendra le joueur que sa paire perdra le point les fois suivantes.\n- La deuxième fois et les fois suivantes, la paire du joueur perd le point. Nota : Cette règle s’applique si le joueur fait tomber sa casquette, son bandana ou tout objet lui appartenant alors que le point continue."}, {"n": 166, "c": 11, "p": 16, "q": "Le joueur A (paire A/B) sert une première balle de service qui tombe dans le filet. Celle-ci se coince dans une des mailles du filet. A sert sa seconde balle sans retirer la première et au cours de l’échange qui suit, une balle touche le filet et fait tomber la balle qui y était coincée. Celle-ci roule légèrement dans le terrain de la paire A/B. Décision ?", "a": "Un let peut être annoncé, sauf si cette décision lèse manifestement l’une des paires ou si la balle n’est déjà plus en jeu."}, {"n": 167, "c": 11, "p": 16, "q": "Un objet étranger apparaît sur le terrain en cours d’échange, les joueurs poursuivent l’échange. A la fin du point, la paire qui a perdu le point réclame un LET car elle prétend avoir été gênée. Décision ?", "a": "Le point joué reste acquis."}, {"n": 168, "c": 11, "p": 17, "q": "Le joueur A montant à la volée, une balle tombe de sa poche. Surpris, il s’arrête de jouer et réclame rejouer le point. Décision ?", "a": "La paire du joueur perd le point. En effet, le joueur ne peut pas réclamer un LET dans la mesure où il s’est gêné lui-même."}, {"n": 169, "c": 11, "p": 17, "q": "Un spectateur crie alors qu’un joueur se prépare à smasher. Le joueur rate son smash, puis réclame un let. Décision ?", "a": "Le point n’a pas à être rejoué, le joueur ayant essayé de le gagner malgré la gêne extérieure."}, {"n": 170, "c": 11, "p": 17, "q": "Le joueur A de la paire A/B frappe un smash. Juste après, une balle arrive sur le terrain. Le smash de A touche directement la grille du côté de la paire C/D, leurs adversaires. Décision ?", "a": "Point pour la paire C/D."}, {"n": 171, "c": 11, "p": 17, "q": "Qui est responsable des annonces LET au service ?", "a": "Chaque paire peut annoncer un LET, qu’elle soit au service ou à la relance."}, {"n": 172, "c": 12, "p": 17, "q": "On distingue 2 types de gêne qui peuvent être causées par les joueurs. Lesquels ?", "a": "- La gêne intentionnelle.\n- La gêne non intentionnelle."}, {"n": 173, "c": 12, "p": 17, "q": "Quelle est la conséquence d’une gêne intentionnelle ?", "a": "Si la gêne est volontaire, le point sera donné à la paire adverse."}, {"n": 174, "c": 12, "p": 17, "q": "Quelle est la conséquence d’une gêne non intentionnelle ?", "a": "Si la gêne est jugée involontaire, le point sera rejoué (LET)."}, {"n": 175, "c": 12, "p": 17, "q": "Le jeu à l’extérieur est autorisé, suite à un smash de A (paire A/B), qui sort au-dessus de la paroi latérale, le joueur C (paire C/D) sort mais B se met en travers de sa route. Décision ?", "a": "C’est une gêne volontaire, la paire A/B perd le point."}, {"n": 176, "c": 12, "p": 17, "q": "Au moment où A va faire un smash, un de ses adversaires agite les bras pour le perturber. A s’arrête. Décision ?", "a": "La paire du joueur A gagne le point."}, {"n": 177, "c": 12, "p": 17, "q": "Au moment où A va faire un smash, un de ses adversaires agite les bras pour le perturber. A tente de smasher et fait une faute. Décision ?", "a": "La paire du jouer A perd le point car il ne peut pas prétendre être gêné alors qu’il a essayé de jouer le coup."}, {"n": 178, "c": 12, "p": 17, "q": "Un smash de A (paire A/B) touche le sol adverse, la vitre de fond et revient dans son camp. C (paire C/D) se précipite au filet pour jouer la balle. B qui est filet ne bouge pas et place sa raquette devant lui pour se protéger. C ne peut jouer la balle car est gêné par B. Décision ?", "a": "La gêne n’est pas volontaire, le point est à rejouer (LET)."}, {"n": 179, "c": 12, "p": 17, "q": "Paire A/B contre paire C/D. A fait une volée qu’il estime gagnante et crie « allez ». C parvient juste à toucher la balle, sans essayer de la renvoyer et prétend être gêné. Décision ?", "a": "Point pour la paire C/D car il n’a pas joué le point."}, {"n": 180, "c": 12, "p": 18, "q": "Un joueur se dit gêné par l’un de ses adversaires qui pousse des petits cris en frappant la balle. Décision ?", "a": "Pas de faute a priori, mais la décision est laissée à l’appréciation du Juge-Arbitre, superviseur, qui, s’il considère qu’il y a eu gêne effective, peut prononcer un LET ou donner point perdu à la paire du joueur qui a crié s’il estime que cela a été volontaire."}, {"n": 181, "c": 12, "p": 18, "q": "Un joueur qui avait la possibilité de faire un coup gagnant ne renvoie qu’une balle facile, et crie alors : « C’est nul ». Ses adversaires, surpris, ne jouent pas la balle. Décision ?", "a": "La paire du joueur qui a crié en cours d’échange perd le point."}, {"n": 182, "c": 12, "p": 18, "q": "Un joueur annonce « faute » car il pense que la balle a directement touché une vitre et réalise immédiatement qu’il s’est trompé. Décision ?", "a": "Ceci est considéré comme une gêne intentionnelle, donc la paire de ce joueur perd le point."}, {"n": 183, "c": 12, "p": 18, "q": "Avant le début d’un échange, le joueur A (paire A/B) peut-il demander à ses adversaires (paire C/D) d’écarter une balle sur le terrain de leur côté du filet ? Que se passe-t-il si la balle n’est pas écartée et qu’un joueur de la paire C/D la touche ?", "a": "- Oui, mais C/D ne sont pas obligés de le faire.\n- Si pendant l’échange C ou D touche involontairement la balle alors le point sera à rejouer la première fois (et perdu les fois suivantes).\n- Si pendant l’échange C ou D l’écarte volontairement alors le point sera perdu par C/D (gêne volontaire)."}, {"n": 184, "c": 13, "p": 18, "q": "Dans l’échange, après un rebond au sol, la balle touche une autre surface (vitre, grillage…) du même camp. Décision ?", "a": "Le point continue.\nNote : Ainsi, la poignée de la porte, les grillages, les murs font partie intégrante du terrain."}, {"n": 185, "c": 13, "p": 18, "q": "Une balle frappée par un joueur touche directement une vitre du terrain adverse ou un grillage avant de toucher le sol. Décision ?", "a": "La paire du joueur qui a frappé cette balle perd le point."}, {"n": 186, "c": 13, "p": 18, "q": "Une balle frappée par un joueur touche le filet (ou sa protection) puis directement une vitre ou un grillage avant de toucher le sol du terrain adverse. Décision ?", "a": "La paire du joueur qui a frappé cette balle perd le point."}, {"n": 187, "c": 13, "p": 18, "q": "Une balle qui allait directement toucher une vitre est jouée de volée par un joueur. Décision ?", "a": "Le point continue."}, {"n": 188, "c": 13, "p": 18, "q": "Une balle sort au-dessus de la paroi latérale, touche une branche d’arbre puis est renvoyée bonne. Décision ?", "a": "Point pour la paire ayant fait le smash, même s’il n’y a pas eu un 2ème rebond au sol."}, {"n": 189, "c": 13, "p": 18, "q": "Un smash raté de A (paire A/B) allait sortir mais touche le poteau du filet et revient du côté de la paire C/D, leurs adversaires. Décision ?", "a": "Le point continue."}, {"n": 190, "c": 13, "p": 18, "q": "Sur un smash, la balle frappée par A (paire A/B) touche le sol du côté adverse, la vitre de fond puis le poteau de la lumière. Elle est alors renvoyée bonne par C, (paire C/D). Décision ?", "a": "Point gagné par la paire A/B."}, {"n": 191, "c": 13, "p": 18, "q": "En cours d’échange, le joueur B de la paire A/B fait tomber sa casquette, le Juge- Arbitre, superviseur intervient et fait rejouer le point. Dans le jeu suivant, le même joueur fait tomber une balle de sa poche juste avant de smasher. Leurs adversaires C/D arrêtent le point car ils s’estiment gênés. Décision ?", "a": "Point gagné par la paire C/D."}, {"n": 192, "c": 13, "p": 19, "q": "Dans le cas où le jeu à l'extérieur du terrain est autorisé, une balle sort du terrain en passant au-dessus de la grille de fond. Décision ?", "a": "Le point se termine au moment où la balle sort de la piste par la paroi du fond."}, {"n": 193, "c": 13, "p": 19, "q": "Un smash de A (paire A/B) touche le sol du côté de la paire C/D, puis la vitre du fond puis revient du côté de A/B. Le joueur C saute alors par-dessus le filet pour jouer cette balle et atterrit en dehors du terrain, il n’a rien touché. Décision ?", "a": "Point pour la paire A/B."}, {"n": 194, "c": 13, "p": 19, "q": "Le jeu à l'extérieur est autorisé. Un joueur sort un smash au-dessus de la grille de fond, mais dans son élan, touche le filet après que la balle a franchi la grille de fond de terrain mais avant que la balle ne touche le sol. Décision ?", "a": "La paire de ce joueur gagne le point car la balle n’est plus en jeu dès qu’elle sort au-delà de la paroi du fond."}, {"n": 195, "c": 13, "p": 19, "q": "Lors d’un échange, un joueur de la paire A/B smashe, la balle touche le sol du côté adverse puis la vitre du fond puis le poteau du filet et revient dans son propre camp. Ce joueur rattrape la balle avec la main. Décision ?", "a": "Point perdu par la paire A/B."}, {"n": 196, "c": 13, "p": 19, "q": "Le jeu à l'extérieur du terrain est autorisé. Pendant un échange, le joueur A (paire A/B) envoie un lob dehors par-dessus la grille latérale. Avant que la balle ne touche le sol, et sous l’action du vent, le filet touche l’un des joueurs de la paire C/D qui était au filet. Décision ?", "a": "Point gagné par la paire A/B."}, {"n": 197, "c": 13, "p": 19, "q": "Le jeu à l'extérieur du terrain est autorisé. Une balle sort au-dessus de la paroi latérale suite à un smash, un joueur de la paire adverse sort du terrain, frappe la balle directement dans le poteau du filet ou sa protection. Elle retombe bonne dans le terrain adverse. Décision ?", "a": "Le point continue."}, {"n": 198, "c": 13, "p": 19, "q": "Le jeu à l'extérieur du terrain est autorisé, un joueur de la paire A/B sort la balle au- dessus de la paroi latérale et un joueur de la paire C/D joue la balle à l'extérieur du terrain et envoie la balle du côté de la paire A/B directement dans le filet, la balle roule ensuite au sol. Décision ?", "a": "Point pour la paire C/D."}, {"n": 199, "c": 13, "p": 19, "q": "Les sorties ne sont pas autorisées. Suite à un coup très croisé frappé par la paire A/B, la balle rebondit une fois dans le camp de C/D puis sort au niveau de la porte. Le joueur C qui était au filet et qui a les 2 pieds dans le terrain sort le bras et sa raquette et renvoie cette balle bonne, du côté de la paire A/B. Décision ?", "a": "Point pour la paire A/B."}, {"n": 200, "c": 13, "p": 19, "q": "Le jeu à l'extérieur du terrain est autorisé. Suite à un smash de A (paire A/B), la balle touche le sol adverse puis la vitre du fond, repasse dans le camp de A/B, rebondit 2 fois sur le sommet de la paroi latérale puis sort. Le joueur C, qui était sorti, renvoie alors la balle bonne du côté de A/B. Décision ?", "a": "Le point continue."}, {"n": 201, "c": 13, "p": 19, "q": "Le jeu à l'extérieur du terrain est autorisé. Un joueur sort et pose sa main sur le poteau du filet avant de renvoyer la balle bonne. Décision ?", "a": "La paire de ce joueur perd le point."}, {"n": 202, "c": 13, "p": 19, "q": "Le jeu à l'extérieur du terrain est autorisé. Un joueur sort et renvoie la balle sur le poteau puis elle tombe bonne. Décision ?", "a": "Le point continue."}, {"n": 203, "c": 13, "p": 19, "q": "Un joueur au filet intercepte la balle adverse avant qu’elle n’ait franchit le filet, et réalise un magnifique coup gagnant. Décision ?", "a": "La paire de ce joueur perd le point."}, {"n": 204, "c": 13, "p": 19, "q": "Lors d’un échange, le smash de A touche le sol du côté adverse, puis la vitre de fond puis revient dans son côté. Un de ses adversaires joue la balle, du côté de A, sans toucher le filet. Décision ?", "a": "Le point continue."}, {"n": 205, "c": 13, "p": 19, "q": "Lors d’un échange, le smash de A touche le sol du côté adverse, puis la vitre de fond puis revient dans son côté et touche une grille. Décision ?", "a": "Point pour la paire du joueur A."}, {"n": 206, "c": 13, "p": 19, "q": "Le jeu à l'extérieur du terrain est autorisé, un joueur sort et renvoie la balle bonne en prenant appui sur le haut de la porte, du côté de ses adversaires. Décision ?", "a": "La paire de ce joueur perd le point."}, {"n": 207, "c": 13, "p": 19, "q": "Sur un smash, la balle touche le sol adverse puis la partie qui prolonge la grille de fond. Elle est ensuite renvoyée bonne. Décision ?", "a": "Point pour la paire du smasheur."}, {"n": 208, "c": 13, "p": 20, "q": "Le Juge-Arbitre constate la mauvaise application d’un point de règlement, peut-il intervenir sans avoir été sollicité par les joueurs ?", "a": "OUI."}, {"n": 209, "c": 13, "p": 20, "q": "Le Juge-Arbitre peut-il intervenir sur une balle bonne ou faute et qui a été mal jugée, sans avoir été sollicité par les joueurs ?", "a": "OUI, sauf si la partie est arbitrée, la décision de l’arbitre est alors définitive."}, {"n": 210, "c": 13, "p": 20, "q": "Une balle frappée par un joueur de la paire A/B se coince dans une grille après avoir rebondi correctement au sol. Décision ?", "a": "Point pour la paire A/B."}, {"n": 211, "c": 13, "p": 20, "q": "Une balle frappée par un joueur de la paire A/B passe au travers d’une grille après avoir rebondi correctement au sol. Décision ?", "a": "Point pour la paire A/B."}, {"n": 212, "c": 13, "p": 20, "q": "Une balle frappée par un joueur de la paire A/B après avoir rebondi correctement au sol puis sur la vitre du fond reste bloquée sur la surface horizontale d’une des parois. Décision ?", "a": "Point pour la paire A/B."}, {"n": 213, "c": 13, "p": 20, "q": "Les joueurs d’une paire prétendent que le score est de 40-30, mais les joueurs de la paire adverse affirment qu’il est de 30-40. Procédure ?", "a": "Les 2 paires ont toutes les 2 gagné 2 points. On ne rejoue que le point sur lequel elles ne sont pas d’accord. On reprend à 30-A."}, {"n": 214, "c": 13, "p": 20, "q": "Qui est responsable des annonces (balles bonnes/fautes, doublées …) ?", "a": "Chaque paire est responsable d’annoncer les balles de son côté du filet."}, {"n": 215, "c": 13, "p": 20, "q": "Un joueur bénéficie d’une interruption pour blessure. L’un de ses adversaires sort son téléphone portable de son sac et se met les écouteurs sur les oreilles. Est-ce autorisé ?", "a": "NON, l’utilisation du téléphone portable ou de tout autre appareil électronique est interdite pendant toute la durée d’une partie."}, {"n": 216, "c": 13, "p": 20, "q": "Au changement de côté, un joueur sort un cahier ou un livre de son sac et commence à le lire. Décision ?", "a": "C’est autorisé dans la mesure où les documents concernés étaient en la possession du joueur à son entrée sur le terrain."}, {"n": 217, "c": 13, "p": 20, "q": "Avant le début d’un échange, un joueur peut-il demander à un joueur de la paire adverse d’écarter une balle sur le terrain de son côté du filet ou coincée dans une des mailles du filet ?", "a": "OUI, mais le joueur n’est pas obligé de l’enlever."}, {"n": 218, "c": 13, "p": 20, "q": "En cours d’échange, une balle frappée par A (paire A/B) vient heurter une balle restée au sol, qui s’y trouvait déjà avant le début de l’échange, du côté de C/D. Décision ?", "a": "Quatre cas sont possibles :\n- C et D ne peuvent renvoyer aucune des 2 balles, A/B gagnent le point ;\n- C parvient à renvoyer la balle en jeu, l’échange se poursuit ;\n- C renvoie l’une des 2 balles, mais on n’est pas sûr que ce soit la balle qui était en jeu, un LET doit être annoncé ;\n- C renvoie la mauvaise balle, A/B gagnent le point."}, {"n": 219, "c": 13, "p": 20, "q": "En terrain couvert, une balle touche directement le plafond. Décision ?", "a": "La balle est faute."}, {"n": 220, "c": 13, "p": 20, "q": "En cours d’échange, un joueur monte au filet. L’un de ses adversaires le vise délibérément et le touche. Décision ?", "a": "Point perdu pour la paire du joueur touché."}, {"n": 221, "c": 13, "p": 20, "q": "En effectuant un smash, un joueur blesse l’un de ses adversaires qui ne peut reprendre la partie. Décision ?", "a": "La paire du joueur qui a smashé a gagné la partie (abandon)."}, {"n": 222, "c": 13, "p": 20, "q": "Dans quels cas une paire peut-elle recevoir des conseils ?", "a": "- En cas d’interruption de la partie, si les joueurs sont sortis du terrain.\n- Par son coach, lors de certains tournois où le coaching est autorisé, et uniquement pendant les temps de repos.\n- En rencontres par équipes, lors des changements de côté, par le capitaine ou son adjoint présent sur le terrain."}, {"n": 223, "c": 13, "p": 20, "q": "Dans quels cas un joueur peut-il légitimement faire appel au Juge-Arbitre ?", "a": "- Pour toute application ou interprétation d’un point de règlement (règles du jeu, règlements sportifs.\n- Jamais pour une question liée à la matérialité des faits (sauf contestation argumentée d’une balle annoncée faute)."}, {"n": 224, "c": 13, "p": 21, "q": "Un joueur fait appel au Juge-Arbitre sur l’interprétation d’un point de règlement. Le jeu doit-il se poursuivre ou être interrompu ?", "a": "Si la décision finale du Juge-Arbitre doit avoir une influence sur le score ou le point en jeu, la partie doit être interrompue. Dans le cas contraire (ex. : un joueur demandant que soit allumé l’éclairage), le jeu doit se poursuivre jusqu’à l’arrivée du Juge-Arbitre."}, {"n": 225, "c": 13, "p": 21, "q": "Une manche normale est commencée alors que le format de jeu prévoit que la 3ème manche est remplacée par un super jeu décisif à 10 points. Décision ?", "a": "- Si un seul point a été joué, l’erreur doit être corrigée immédiatement et le SJD à 10 points est disputé (le point joué est validé comme 1er point du SJD).\n- Si l’erreur est découverte après le début du deuxième point et avant le début du 5ème jeu, alors la manche continue normalement et sera gagnée par la paire qui mènera 3/0, 3/1 ou 4/0. Si le score atteint 2 jeux partout alors un SJD à 10 points sera disputé.\n-Si l’erreur est découverte après le début du 5ème jeu, alors la manche standard continue jusqu’à son terme (avec éventuel JD à 6 partout) sauf si le score est de 2 jeux partout et qu’un seul point a été joué auquel cas un SJD sera joué (le dernier point joué sera validé comme 1er point du SJD)."}, {"n": 226, "c": 13, "p": 21, "q": "À 6 jeux partout, un jeu ordinaire est commencé à la place du jeu décisif. Décision ?", "a": "- Si un seul point a été joué, on revient au jeu décisif, le point joué restant acquis (1-0 ou 0- 1).\n- Dès que le deuxième point a été mis en jeu, on va jusqu’au bout de ce jeu. Le système de l’avantage (2 jeux d’écart) est maintenu jusqu’au score éventuel de 8 jeux partout, où un jeu décisif sera joué."}, {"n": 227, "c": 13, "p": 21, "q": "Un joueur frappe une volée qui semble gagnante mais sa dragonne casse au moment de la frappe et sa raquette lui échappe et retombe dans son camp. Décision ?", "a": "Point perdu pour la paire du joueur dont la dragonne s’est cassée.\nNote : le point sera systématiquement perdu par la paire d’un joueur dès que la dragonne de sa raquette se casse ou dès qu’il ne tient plus sa raquette."}, {"n": 228, "c": 13, "p": 21, "q": "Il commence à pleuvoir légèrement, les joueurs peuvent-ils décider d’un commun accord d’interrompre la partie ?", "a": "Non, seul le Juge-Arbitre peut prendre cette décision."}, {"n": 229, "c": 13, "p": 21, "q": "Les joueurs s’aperçoivent, après l’échange, que le service a été délivré depuis la mauvaise moitié du terrain. Décision ?", "a": "Le point est validé, le service suivant sera délivré conformément au score (donc de la même moitié du terrain que le point précédent)."}, {"n": 230, "c": 13, "p": 21, "q": "Au cours d’un échange, le joueur A (paire A/B) fait une faute qui n’est pas annoncée par ses adversaires et l’échange se poursuit. La paire A/B gagne le point. Leurs adversaires contestent alors le gain du point. Décision ?", "a": "Le point joué est acquis."}, {"n": 231, "c": 13, "p": 21, "q": "En effectuant un smash, le joueur A (paire A/B) laisse échapper sa raquette suite à la casse de la dragonne. La raquette va frapper l’un de ses adversaires. Celui-ci blessé, ne peut reprendre la partie. Décision ?", "a": "La casse de la dragonne entraine la perte du point par la paire A/B. Mais celle-ci gagne la partie par abandon (sauf si le dernier point était la balle de match pour l’autre paire)."}, {"n": 232, "c": 13, "p": 21, "q": "Une balle rebondit dans l’angle du terrain adverse, en touchant simultanément le sol et la vitre de fond. Décision ?", "a": "Le point continue."}, {"n": 233, "c": 13, "p": 21, "q": "Le jeu à l'extérieur du terrain est autorisé. Suite à une balle de A (paire A/B), qui sort au-dessus de la paroi latérale, C (paire C/D) sort et renvoie la balle qui fait un rebond au sommet d'une paroi latérale du côté de A/B puis tombe bonne du côté de A/B. Décision ?", "a": "Point perdu pour la paire C/D."}, {"n": 234, "c": 13, "p": 21, "q": "Le jeu à l'extérieur du terrain est autorisé. Suite à une balle de C (paire C/D), qui sort au-dessus de la paroi latérale, A (paire A/B) est sorti et renvoie la balle qui fait un rebond sur l'extérieur de la grille du côté de C/D puis, avec l'effet (ou sous l'effet du vent), tombe bonne du côté de C/D. Décision ?", "a": "Point perdu par la paire A/B."}, {"n": 235, "c": 13, "p": 21, "q": "Le jeu à l'extérieur du terrain est autorisé. Suite à une balle de C (paire C/D), qui sort au-dessus de la paroi latérale, A (paire A/B) est sorti et renvoie la balle qui fait un rebond sur l'extérieur de la vitre de son propre camp puis, avec l'effet (ou sous l'effet du vent), tombe bonne du côté de C/D. Décision ?", "a": "Le point continue."}, {"n": 236, "c": 13, "p": 21, "q": "Le jeu à l'extérieur du terrain est autorisé. Suite à un une balle qui sort au-dessus de la paroi latérale, un joueur sort puis renvoie la balle qui fait un rebond sur le socle du poteau de filet puis tombe bonne du côté de ses adversaires. Décision ?", "a": "Il appartient au Juge-Arbitre, en début de compétition, de juger si un socle, selon sa taille et sa forme, fait ou non partie du poteau. Toute balle qui touche un socle considéré comme ne faisant pas partie du poteau est \"faute\". Le point continue si le Juge-Arbitre avait décidé que le socle faisait partie du poteau. Le rebond sur le socle ne comptera pas comme premier rebond au sol."}, {"n": 237, "c": 13, "p": 22, "q": "Le joueur A (paire A/B) renvoie la balle en lob qui, sans sortir du terrain, rebondit sur le haut d'une paroi latérale du côté de C/D puis tombe bonne du côté de C/D. Décision ?", "a": "Point perdu pour la paire A/B."}, {"n": 238, "c": 13, "p": 22, "q": "Les sorties ne sont pas autorisées. Le joueur A, sur une amortie, renvoie la balle bonne dans le camp adverse puis, pour éviter de toucher le filet, sort du terrain par la porte. Décision ?", "a": "Le point continue.\nNote : Lorsque les sorties ne sont pas autorisées, la seule frappe autorisée est celle d'un joueur se trouvant dans les limites du terrain et qui frappe une balle non sortie du terrain. Dans tous les cas un joueur peut toujours sortir du terrain pendant un échange (emporté par son élan par exemple)."}, {"n": 239, "c": 14, "p": 22, "q": "Qui peut être sanctionné au travers du code de conduite ?", "a": "- Les joueurs.\n- Les capitaines ou capitaines adjoints lors des compétitions par équipe.\n- Les coachs quand ils sont autorisés."}, {"n": 240, "c": 14, "p": 22, "q": "Qui peut appliquer le code de conduite ?", "a": "Le Juge-Arbitre, le superviseur de piste, ou l’arbitre s’il y en a un."}, {"n": 241, "c": 14, "p": 22, "q": "Les sanctions du code de conduite sont-elles applicables à chaque joueur indépendamment de son partenaire ou à chaque paire ?", "a": "A chaque paire."}, {"n": 242, "c": 14, "p": 22, "q": "Quels sont les faits relevant de l’application du code de conduite pour les joueurs ?", "a": "– jet de balle ;\n– jet de raquette ;\n– coup de raquette sur le sol, le filet, les grilles, les vitres, etc. ;\n– tenue de propos inconvenants ;\n– geste déplacé ;\n– gêne volontaire des adversaires par des paroles, des bruits ou des gestes ;\n– non-respect délibéré de la continuité du jeu entre deux points ou après un changement de côté, notamment pour cause de perte naturelle de condition physique, de blessure ou de refus de reprendre la partie sur ordre de l’arbitre ;\n– sortie du terrain sans autorisation de l’arbitre, superviseur ou du Juge-Arbitre ;\n– conseils ou soins non autorisés par les dispositions des règles du jeu ou des règlements sportifs ;\n– contestation répétée des décisions de l’arbitre ;\n– toute forme de comportement antisportif, notamment lors d’une partie disputée sans arbitre"}, {"n": 243, "c": 14, "p": 23, "q": "Quelles sont les sanctions relevant du code de conduite contre les joueurs ?", "a": "– 1ère infraction : avertissement ;\n– 2ème infraction : 1 point de pénalité ;\n– 3ème infraction : 3 points de pénalité ;\n– 4ème infraction : disqualification. La disqualification ne peut être prononcée que par le Juge-Arbitre (sur requête ou non de l’arbitre). En cas de violence physique ou de grave incorrection (injure, menace, obscénité, etc.), l’arbitre ou le Juge-Arbitre peut, sans avertissement ni point de pénalité préalable, infliger directement trois points de pénalité ; le Juge-Arbitre peut même disqualifier directement le joueur fautif, et donc la paire."}, {"n": 244, "c": 14, "p": 23, "q": "En compétitions par équipes, quels sont les faits relevant de l’application du code de conduite pour les capitaines et adjoints ?", "a": "– tenue de propos inconvenants ;\n– gestes déplacés ;\n– gêne volontaire des adversaires, par des paroles, des bruits ou des gestes ;\n– conseils ou soins non autorisés par les règles du jeu ou des règlements sportifs ;\n– contestation des décisions de l’arbitre ;\n– toute forme de comportement antisportif"}, {"n": 245, "c": 14, "p": 23, "q": "Quelles sont les sanctions relevant du code de conduite contre les capitaines ?", "a": "– 1ère infraction : avertissement ;\n– 2ème infraction : avertissement ;\n– 3ème infraction : disqualification au titre de la rencontre. Elles ne peuvent être prononcées que par le juge-arbitre (sur requête ou non de l’arbitre). En cas de violence physique ou de grave incorrection (injure, menace, obscénité, etc.), le juge-arbitre peut, sans avertissement préalable, prononcer la disqualification."}, {"n": 246, "c": 14, "p": 23, "q": "Des sanctions sont-elles possibles pour un joueur, un coach, ou un capitaine en dehors du terrain ? Par qui seront-elles appliquées ?", "a": "- Oui, contre tout comportement portant atteinte à la sécurité et/ou à l’intégrité des personnes et/ou des biens, menaces, ou insultes.\n- Par le Juge-Arbitre."}, {"n": 247, "c": 14, "p": 23, "q": "Quelles sont les sanctions possibles en dehors du terrain ?", "a": "– 1ère infraction : avertissement ;\n– 2ème infraction : avertissement ;\n– 3ème infraction : disqualification de la compétition ou de la rencontre. Lorsque ce comportement lui apparait particulièrement grave, le juge-arbitre peut, sans avertissement, prononcer directement la disqualification."}, {"n": 248, "c": 14, "p": 23, "q": "Qu’est-ce qu’un dépassement de temps non intentionnel ?", "a": "C’est un non-respect du temps entre 2 points ou un dépassement des 90 secondes lors d’un changement de côté, des 2 minutes lors d’une fin de manche."}, {"n": 249, "c": 14, "p": 23, "q": "Comment est sanctionné un dépassement de temps non intentionnel ?", "a": "La paire fautive reçoit un avertissement puis, à chaque infraction suivante, un point de pénalité. Cette procédure est indépendante de l’application du Code fédéral de conduite."}, {"n": 250, "c": 14, "p": 23, "q": "Au cours de la 1ère manche, le comportement du joueur A entraine l’application du code de conduite : avertissement. Dans la 2ème manche, son partenaire B frappe violemment et volontairement sa raquette sur le sol. Décision ?", "a": "Point de pénalité, paire A/B."}, {"n": 251, "c": 14, "p": 23, "q": "Le score est de 2/2 ég
