alité. Le serveur A de la paire A/B fait un ace. Le joueur C de la paire C/D, qui a eu jusqu'à présent un comportement exemplaire, crie une injure. Son partenaire D a lui déjà eu, en cours de partie, un comportement sanctionné par le Juge- Arbitre par un avertissement puis par un point de pénalité. Quelle sera la sanction prononcée par le Juge-Arbitre et sur quel score la partie reprendra-t-elle ?", "a": "3 points de pénalité contre la paire C/D, la paire A/B mène 3/2 et 0/30 sur le jeu suivant."}, {"n": 252, "c": 14, "p": 23, "q": "Dans un P1000, le joueur A a eu un comportement répréhensible entrainant l’application du code de conduite. Plus tard, le joueur B a également eu un comportement répréhensible entrainant l’application du code de conduite. Plus tard, leur coach injurie les adversaires de la paire dont il est le coach. Décision ?", "a": "3 points de pénalité contre la paire A/B car les sanctions contre le coach s’ajoutent à celles contre les joueurs."}, {"n": 253, "c": 14, "p": 23, "q": "Entre 2 points, un joueur énervé envoie violemment une balle du côté adverse. L’un de ses adversaires est blessé par la balle et ne peut reprendre la partie. Décision ?", "a": "La paire du joueur qui a blessé son adversaire en dehors d’une action de jeu est immédiatement disqualifiée."}, {"n": 254, "c": 14, "p": 23, "q": "Le joueur A a eu un comportement répréhensible entrainant l’application du code de conduite. Plus tard, B refuse de reprendre le jeu suite à la fin d’un traitement médical. Décision ?", "a": "Application du code de conduite, point de pénalité pour la paire A/B."}, {"n": 255, "c": 14, "p": 23, "q": "Le code de conduite est-il applicable à l’échauffement ?", "a": "OUI, il s’applique depuis l’entrée des joueurs sur le terrain."}]}</script>
<script>
const REF="nikfwvmrrytshvlrgqae",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pa2Z3dm1ycnl0c2h2bHJncWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNDI2ODcsImV4cCI6MjEwODYxODY4N30.sQ2qASKb48vh2T81abhTV5Abaz0z4pGLldvl4X7eJiQ",API="https://"+REF+".supabase.co/rest/v1/",H={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};
const $=s=>document.querySelector(s),esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},LW=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const todayS=()=>new Date().toLocaleDateString("sv");
const fd=d=>d?new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}):"date à venir";
const ERR={inconnu:"Licence inconnue. Elle apparaît après ton 1er tournoi avec Padel+. Vérifie le numéro.",faux:"Code faux. Réessaie.",bloque:"Trop d’essais. Réessaie dans 15 minutes.",code:"Le code doit faire 4 chiffres."};
let ME=null,pin="",busy=false;
async function login(lic,code){const r=await fetch(API+"rpc/padel_joueur_login",{method:"POST",headers:H,body:JSON.stringify({p_lic:lic,p_pin:code})});if(!r.ok)throw new Error("Connexion impossible. Vérifie ta connexion internet.");return r.json()}
function vEntree(msg){document.getElementById("app").innerHTML=`<div class="bgp"></div><div class="glow"></div><div class="shade"></div><div class="in">
<div class="logo"><img src="icon-192.png" alt=""><b>PADEL<span>+</span> Joueur</b></div>
<div class="hello">Bienvenue<br><em>sur la piste.</em></div>
<div class="sub">Ton numéro de licence et ton code à 4 chiffres. La 1re fois, choisis ton code et retiens-le.</div>
<label class="f"><small>N° DE LICENCE</small><input id="lic" autocomplete="username" autocapitalize="characters" placeholder="1234567 A" value="${esc((LS("pp_moi")||{}).lic||"")}"></label>
<div class="pinw"><div class="pinl">CODE À 4 CHIFFRES</div><div class="pin" id="pin">${[0,1,2,3].map(()=>"<span></span>").join("")}</div><input id="pinin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-label="Code à 4 chiffres"></div>
<div class="err" id="err">${esc(msg||"")}</div>
<button class="go" id="go">Entrer</button>
<div class="small">Ton code reste secret : même le juge-arbitre ne peut pas le voir.</div></div>`;
const pi=$("#pinin"),draw=()=>{[...document.querySelectorAll("#pin span")].forEach((s,i)=>{s.innerHTML=i<pin.length?"<i></i>":"";s.classList.toggle("on",i==pin.length)})};pin="";draw();
pi.addEventListener("input",()=>{pin=pi.value.replace(/\D/g,"").slice(0,4);pi.value=pin;draw();if(pin.length==4)go()});
$("#go").onclick=go}
async function go(){if(busy)return;const lic=($("#lic").value||"").trim();if(!lic){$("#err").textContent="Écris ton numéro de licence.";return}if(pin.length!=4){$("#err").textContent=ERR.code;$("#pinin").focus();return}
busy=true;$("#go").disabled=true;$("#go").textContent="…";try{const r=await login(lic,pin);if(!r.ok){busy=false;vEntree(ERR[r.err]||"Erreur : "+r.err);return}LW("pp_moi",{lic,pin});ME=r;busy=false;vHome(r.first);loadStats()}catch(e){busy=false;vEntree(e.message)}}
function nextT(){const L=(ME.tournois||[]).slice(),t=todayS();const up=L.filter(x=>(x.d||"9999")>=t).sort((a,b)=>(a.d||"9999").localeCompare(b.d||"9999"));return up[0]||L.sort((a,b)=>(b.d||"").localeCompare(a.d||""))[0]||null}
function tname(x){return x.c||x.t||"Tournoi"}
function openT(id){LW("pj_me_"+id,{u:ME.uid,n:((ME.prenom||"")+" "+(ME.nom||"")).trim()});location.href="joueur.html?r="+REF+"&k="+encodeURIComponent(KEY)+"&i="+encodeURIComponent(id)}
function vHome(first){const n=nextT(),L=ME.tournois||[],live=L.find(x=>x.d==todayS()),ini=((ME.prenom||"?")[0]+(ME.nom||"?")[0]).toUpperCase(),y=new Date().getFullYear();
document.getElementById("app").innerHTML=`<div class="home"><div class="hd"><div class="av">${esc(ini)}</div><div><b>Salut ${esc(ME.prenom||"")}</b><small>${first?"Ton code est enregistré ✓":L.length+" tournoi"+(L.length>1?"s":"")+" avec Padel+"}</small></div><button onclick="vMoi()">Moi</button></div>
${live?`<button class="live" onclick="openT('${esc(live.id)}')"><i></i>EN DIRECT · ${esc(tname(live))}${live.l?" · "+esc(live.l):""}<span>Ouvrir ›</span></button>`:""}
<div class="tiles">
<button class="tile big" style="animation-delay:.1s" ${n?`onclick="openT('${esc(n.id)}')"`:""}><div class="ill"><div class="c3"><div class="cf"><i class="n"></i><i class="sl"></i><i class="sr"></i><i class="ml"></i><i class="mr"></i></div><i class="bl"></i></div></div><small>${n&&(n.d||"")>=todayS()?"MON PROCHAIN TOURNOI":"MON DERNIER TOURNOI"}</small><b>${n?esc(tname(n)):"Pas encore de tournoi"}</b><span>${n?esc(fd(n.d))+(n.l?" · "+esc(n.l):""):"Il apparaîtra ici dès ta prochaine inscription."}</span></button>
<button class="tile" style="animation-delay:.2s" onclick="vListe()"><div class="ill"><svg viewBox="0 0 120 90"><rect x="14" y="10" width="92" height="70" rx="12" fill="#1c2766" stroke="#3a4699"/><rect x="14" y="10" width="92" height="18" rx="12" fill="#2a3680"/><g fill="#3a4699">${[0,1,2].map(r=>[0,1,2,3,4].map(c=>`<rect x="${22+c*16}" y="${35+r*14}" width="12" height="10" rx="3"/>`).join("")).join("")}</g><rect class="blink" x="54" y="49" width="12" height="10" rx="3" fill="#b6ef2a"/></svg></div><small>MES TOURNOIS</small><b>${L.length} tournoi${L.length>1?"s":""}</b><span>tout l’historique</span></button>

/* n°669 : mes stats (calculées depuis mes tournois) + question du jour (255 questions FFT) */
const R255=JSON.parse(document.getElementById("r255").textContent);
function qOfDay(){const d=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);return R255.q[d%R255.q.length]}
function vQuiz(){const x=qOfDay(),ch=(R255.ch.find(c=>c.n==x.c)||{}).t||"";sheet(`<h2>Question du jour <button onclick="this.closest('.sheet').remove()">✕</button></h2><div class="qz"><small>QUESTION N°${x.n} · ${esc(ch)}</small><p>${esc(x.q)}</p><button class="go" onclick="this.style.display='none';this.nextElementSibling.hidden=false">Voir la réponse</button><div class="qa" hidden><small>RÉPONSE</small><p>${esc(x.a).replace(/\n/g,"<br>")}</p><div class="src">Source : ${esc(R255.src)}, page ${x.p}.</div></div></div>`)}
let ST=null;
async function loadStats(){const L=ME.tournois||[];const out={m:0,v:0,jg:0,jp:0,best:null,part:{},t:0,wa:{}};await Promise.all(L.map(async x=>{try{const r=await fetch(API+"rpc/padel_live_get",{method:"POST",headers:H,body:JSON.stringify({pid:x.id})});if(!r.ok)return;const D=await r.json();if(!D||!D.T)return;const ti=D.T.findIndex(T=>T[7]==ME.uid||T[8]==ME.uid);if(ti<0)return;out.t++;if(D.w&&/^https:\/\//.test(D.w)&&D.c)out.wa[D.c]=D.w;const T=D.T[ti],pa=T[7]==ME.uid?T[1]:T[0];if(pa&&pa[0]){const k=pa[0]+" "+(pa[1]||"");out.part[k]=(out.part[k]||0)+1}
(D.M||[]).forEach(m=>{if(m.st!="f"||(m.a!=ti&&m.b!=ti))return;const i=m.a==ti?0:1;out.m++;if(m.w===i)out.v++;(m.s||"").split(" ").forEach(z=>{const q=z.split("-");if(q.length==2){out.jg+=+q[i]||0;out.jp+=+q[1-i]||0}})});const rk=(D.rk||[]).find(r=>r[0]==ti);if(rk&&rk[1]&&(out.best==null||rk[1]<out.best.p))out.best={p:rk[1],t:x.c||x.t||"",l:x.l||""}}catch(e){}}));ST=out;const v=document.getElementById("stv"),s=document.getElementById("sts");if(v)v.textContent=out.m?Math.round(100*out.v/out.m)+" %":"–";if(s)s.textContent=out.m?"de victoires · "+out.m+" matchs":"après ton 1er match";const wb=document.getElementById("wac"),E=Object.entries(out.wa);if(wb&&E.length)wb.innerHTML=`<div class="wac"><small>💬 MES CANAUX WHATSAPP</small><span>Les prochains tournois de ta catégorie, annoncés en premier.</span><div>${E.map(([c,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(c)} ›</a>`).join("")}</div></div>`}
function vStats(){const s=ST;if(!s){sheet(`<h2>Mes stats <button onclick="this.closest('.sheet').remove()">✕</button></h2><div class="empty">Calcul en cours…</div>`);return}const P=Object.entries(s.part).sort((a,b)=>b[1]-a[1]);
sheet(`<h2>Mes stats <button onclick="this.closest('.sheet').remove()">✕</button></h2><div class="sg"><div><b>${s.m?Math.round(100*s.v/s.m):0}<small>%</small></b><span>de victoires</span></div><div><b>${s.v}<small>/${s.m}</small></b><span>matchs gagnés</span></div><div><b>${s.jg}</b><span>jeux gagnés</span></div><div><b>${s.jg-s.jp>0?"+":""}${s.jg-s.jp}</b><span>différence de jeux</span></div></div>${s.best?`<div class="kv"><span>Meilleur résultat</span><b>${s.best.p}${s.best.p==1?"er":"e"} · ${esc(s.best.t)}</b></div>`:""}<div class="kv"><span>Tournois joués</span><b>${s.t}</b></div>${P.length?`<div class="lab2">MES PARTENAIRES</div>${P.map(([n,c])=>`<div class="kv"><span><b style="color:#fff">${esc(n.split(" ")[0])}</b> ${esc(n.split(" ").slice(1).join(" "))}</span><b>${c} tournoi${c>1?"s":""}</b></div>`).join("")}`:""}<div class="small" style="text-align:left">Calculé à partir de tes tournois avec Padel+.</div>`)}
function sheet(h){const o=document.createElement("div");o.className="sheet";o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML="<div>"+h+"</div>";document.body.appendChild(o)}
function vListe(){const L=(ME.tournois||[]).slice().sort((a,b)=>(b.d||"").localeCompare(a.d||"")),t=todayS();
sheet(`<h2>Mes tournois <button onclick="this.closest('.sheet').remove()">✕</button></h2>${L.length?L.map(x=>{const d=x.d?new Date(x.d+"T12:00"):null;return `<button class="tr" onclick="openT('${esc(x.id)}')"><span class="d">${d?d.getDate():"–"}<small>${d?d.toLocaleDateString("fr-FR",{month:"short"}).toUpperCase():""}</small></span><span><b>${esc(tname(x))}</b><small>${esc(x.l||"")}</small></span>${x.d==t?'<span class="tag">EN DIRECT</span>':x.d>t?'<span class="tag" style="background:#2a3470;color:#fff">À VENIR</span>':""}</button>`}).join(""):'<div class="empty">Aucun tournoi pour l’instant.</div>'}`)}
/* n°673 : notifications « C’est à toi ! » (actives quand PUSH_KEY est rempli, après l’installation côté Supabase) */
const PUSH_KEY="";
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
const pushOK=()=>!!(PUSH_KEY&&"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window);
const b64u=x=>{const p="=".repeat((4-x.length%4)%4),r=atob((x+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function pushOn(btn){try{btn.disabled=true;btn.textContent="…";const ok=await Notification.requestPermission();if(ok!=="granted"){btn.textContent="Notifications refusées (Réglages de l’iPhone › Padel+)";return}const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(PUSH_KEY)});const s=LS("pp_moi")||{};const r=await fetch(API+"rpc/padel_push_sub",{method:"POST",headers:H,body:JSON.stringify({p_lic:s.lic,p_pin:s.pin,p_sub:sub.toJSON()})});LW("pp_push",r.ok?1:null);btn.textContent=r.ok?"✓ Notifications activées":"Réessaie plus tard"}catch(e){btn.disabled=false;btn.textContent=/standalone|support/i.test(e.message)?"Ajoute d’abord Padel+ à l’écran d’accueil":"Réessaie plus tard"}}
const pushBox=()=>!pushOK()?"":LS("pp_push")&&Notification.permission==="granted"?`<div class="kv"><span>Notifications</span><b>✓ activées</b></div>`:`<button class="go pushb" onclick="pushOn(this)">🔔 Me prévenir quand c’est à moi</button><div class="small" style="text-align:left">« 🎾 C’est à toi ! » quand ton match est lancé, et un rappel la veille.${/iP(hone|ad)/.test(navigator.userAgent)&&!navigator.standalone?" Sur iPhone : ajoute d’abord Padel+ à l’écran d’accueil.":""}</div>`;
function vMoi(){sheet(`<h2>Moi <button onclick="this.closest('.sheet').remove()">✕</button></h2><div class="kv"><span>Nom</span><b>${esc((ME.nom||"").toUpperCase())} ${esc(ME.prenom||"")}</b></div><div class="kv"><span>Licence</span><b>${esc((LS("pp_moi")||{}).lic||"")}</b></div><div class="kv"><span>Tournois</span><b>${(ME.tournois||[]).length}</b></div>${pushBox()}<button class="out" onclick="LW('pp_moi',null);location.reload()">Se déconnecter</button>`)}
(async()=>{const s=LS("pp_moi");if(s&&s.lic&&s.pin){try{const r=await login(s.lic,s.pin);if(r.ok){ME=r;vHome(false);loadStats();return}LW("pp_moi",null);vEntree(ERR[r.err]||"")}catch(e){vEntree(e.message)}}else vEntree("")})();
