<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Padel+ Arena</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0a1020">
<style>
:root{--bg:#0a1020;--card:rgba(255,255,255,.07);--ln:rgba(255,255,255,.13);--tx:#eef2ff;--mu:#aab0e0;--lime:#c6f432;--vio:#6b5cff;--or:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg)}
body{min-height:100vh;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(700px 500px at 20% -10%,#2a2475,var(--bg) 65%) fixed;padding:calc(16px + env(safe-area-inset-top)) 16px 90px}
.c{max-width:520px;margin:0 auto}.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hd img{width:46px;height:46px;border-radius:12px}.hd b{font-size:22px}.hd b i{font-style:normal;color:var(--lime)}.hd small{display:block;color:var(--mu);font-weight:600;font-size:13px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:0 0 12px}
h1{font-size:24px;margin:0 0 6px}h2{font-size:19px;margin:18px 2px 10px}p{color:var(--mu);line-height:1.45;margin:0 0 12px}
input{width:100%;font:700 20px inherit;font-family:inherit;padding:14px;border-radius:14px;border:2px solid var(--ln);background:#fff;color:#1b2150;margin:0 0 10px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:800 19px inherit;font-family:inherit;background:var(--lime);color:#0a1020;cursor:pointer}
.btn:active,.o:active{transform:scale(.97)}
.pts{display:flex;justify-content:space-between;align-items:center;background:var(--lime);color:#0a1020;border-radius:16px;padding:12px 16px;font-weight:900;font-size:18px;margin:0 0 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,16,32,.96);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:5}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:700 13px inherit;font-family:inherit;padding:6px 2px;border-radius:12px;position:relative}.tabs button b{display:block;font-size:22px}.tabs button.on{color:#fff;background:rgba(107,92,255,.35)}
.dot{position:absolute;top:2px;right:24%;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;line-height:18px;font-weight:900}
.q{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:0 0 12px}.q.new{border-color:var(--lime);box-shadow:0 0 0 2px rgba(198,244,50,.25)}
.qt{font-weight:800;font-size:17px;margin:0 0 4px}.qm{font-size:12.5px;color:var(--mu);margin:0 0 10px;display:flex;gap:8px;flex-wrap:wrap}.qm span{background:rgba(255,255,255,.08);border-radius:8px;padding:2px 7px}
.os{display:flex;flex-wrap:wrap;gap:8px}.o{border:1px solid rgba(255,255,255,.22);background:none;color:var(--tx);border-radius:12px;padding:10px 12px;font:600 15px inherit;font-family:inherit;text-align:left;cursor:pointer}
.o.on{background:var(--vio);border-color:var(--vio);font-weight:800}.o.ok{background:#1f9d5a;border-color:#1f9d5a}.o.ko{background:#7a2b2b;border-color:#7a2b2b}
.os.col{flex-direction:column}.os.col .o{width:100%}
.ni{display:flex;gap:8px;align-items:center}.ni input{width:130px;margin:0;font-size:18px;padding:10px}.ni span{color:var(--mu)}
select{width:100%;font:600 15px inherit;font-family:inherit;padding:10px;border-radius:12px;margin:0 0 8px;background:#fff;color:#1b2150;border:0}
.res{margin-top:10px;font-size:14px;font-weight:800;border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.08)}.res.g{background:rgba(31,157,90,.35)}
.lb{list-style:none;margin:0;padding:0}.lb li{display:flex;font-size:18px;padding:11px 6px;border-bottom:1px solid var(--ln)}.lb li b{width:36px;color:var(--mu)}.lb li em{margin-left:auto;font-style:normal;font-weight:900;color:var(--lime)}.lb li.me{background:rgba(107,92,255,.3);border-radius:10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--lime);color:#0a1020;font-weight:900;padding:10px 16px;border-radius:14px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.sv{font-size:12px;color:var(--mu);text-align:right;margin-top:6px;min-height:15px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:16px}
.gm{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:0 0 12px;display:flex;align-items:center;gap:14px;cursor:pointer}.gm i{font-style:normal;font-size:40px}.gm b{display:block;font-size:19px}.gm small{color:var(--mu);font-size:14px}.gm em{margin-left:auto;font-style:normal;font-weight:900;color:var(--lime);text-align:right;font-size:15px}
.hud{display:flex;justify-content:space-between;gap:6px;font-size:15px;font-weight:800;margin:0 0 10px}.hud span{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
.dirs{display:flex;gap:8px;margin:10px 0}.dirs button{flex:1;border:2px solid rgba(255,255,255,.2);background:none;color:var(--tx);border-radius:14px;padding:12px 4px;font:800 15px inherit;font-family:inherit}.dirs button.on{border-color:var(--lime);background:rgba(198,244,50,.18)}
.pw{position:relative;height:30px;border-radius:15px;background:linear-gradient(90deg,#2ecc71,#c6f432 55%,#f2994a 80%,#e74c3c);margin:12px 0}.pw .sw{position:absolute;top:-5px;bottom:-5px;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 2px rgba(0,0,0,.3)}.pw .cur{position:absolute;top:-9px;width:8px;height:48px;background:#fff;border-radius:4px;margin-left:-4px;box-shadow:0 0 8px rgba(0,0,0,.6)}
.bigr{font-size:46px;font-weight:900;text-align:center;line-height:1.05;margin:6px 0}.bigr.ok{color:var(--lime)}.bigr.ko{color:#ff8a8a;font-size:30px}
.rf{height:300px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.qz{font-size:20px;font-weight:800;margin:6px 0 14px}.ex{font-size:15px;color:#dfe3ff;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.4}

<script>
const P=new URLSearchParams(location.search),REF=P.get("r")||"",KEY=P.get("k")||"",GID=P.get("g")||"",API="https://"+REF+".supabase.co/rest/v1/rpc/";
const LS="padelarena_"+GID;let ME=null,D=null,ANS={},TAB="pro",SEEN={},KN=null,saveT=null,first=true;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
try{const o=JSON.parse(localStorage.getItem(LS)||"null");if(o){ME=o.me;ANS=o.ans||{};SEEN=o.seen||{};KN=o.kn||null}}catch(e){}
const keep=()=>{try{localStorage.setItem(LS,JSON.stringify({me:ME,ans:ANS,seen:SEEN,kn:KN}))}catch(e){}};
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>x.toString(36).padStart(2,"0")).join("").slice(0,n*2)};
async function rpc(f,b){const r=await fetch(API+f,{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.msg))||("Erreur "+r.status));return j}
function toast(t){const o=document.createElement("div");o.className="toast";o.textContent=t;document.body.appendChild(o);setTimeout(()=>o.remove(),2600)}
async function load(){if(!REF||!KEY||!GID){$("#app").innerHTML='<div class="box"><h1>Lien incomplet</h1><p>Scanne à nouveau le QR code sur l’écran du club.</p></div>';return}
try{const d=await rpc("arena_get",{g:GID});if(!d||!d.q){$("#app").innerHTML='<div class="box"><h1>Les jeux ne sont pas encore ouverts</h1><p>Réessaie dans un instant.</p></div>';return}
const old=D;D=d;$("#sub").textContent=d.t||d.cat||"Tournoi";
const ids=d.q.filter(q=>!q.cl).map(q=>q.id),newIds=KN?ids.filter(i=>!KN.includes(i)):[];KN=[...new Set([...(KN||[]),...ids])];keep();if(newIds.length&&ME)toast("🔔 "+newIds.length+" nouvelle"+(newIds.length>1?"s":"")+" question"+(newIds.length>1?"s":"")+" !");
if(!GM)render()}catch(e){if(first)$("#app").innerHTML='<div class="box"><h1>Connexion impossible</h1><p>'+esc(e.message)+'. Vérifie ta connexion internet.</p></div>'}first=false}
function join(){const v=($("#nm").value||"").trim().replace(/\s+/g," ");if(v.length<2){$("#nm").focus();return}const parts=v.split(" "),name=(parts[0].charAt(0).toUpperCase()+parts[0].slice(1).toLowerCase()+(parts[1]?" "+parts[1].charAt(0).toUpperCase()+".":"")).slice(0,24);ME={pid:rnd(8),sec:rnd(12),name};keep();send(true);render()}
function setA(id,v){ANS[id]=v;SEEN[id]=1;keep();render();clearTimeout(saveT);$("#sv")&&($("#sv").textContent="Enregistrement…");saveT=setTimeout(()=>send(),500)}
async function send(){if(!ME)return;try{const r=await rpc("arena_answer",{g:GID,p:ME.pid,s:ME.sec,n:ME.name,a:ANS});const e=$("#sv");if(e)e.textContent=r=="ok"?"✓ Réponses enregistrées":"⚠ "+r}catch(e){const s=$("#sv");if(s)s.textContent="⚠ Pas de réseau : nouvel essai bientôt";setTimeout(send,8000)}}
function setTop(id,k,v,n){const a=Array.isArray(ANS[id])?ANS[id].slice():Array(n).fill("");a[k]=v===""?"":(isNaN(+v)?v:+v);for(let j=0;j<n;j++)if(j!=k&&String(a[j])===String(a[k])&&a[k]!=="")a[j]="";setA(id,a)}
const mine=()=>{if(!D||!ME)return{p:0,r:null,n:0};const lb=D.lb||[],i=lb.findIndex(x=>x[0]==ME.pid);return{p:i>=0?lb[i][2]:0,r:i>=0?i+1:null,n:lb.length}};
function qHtml(q){const a=ANS[q.id],cl=!!q.cl,got=D.res&&D.res[ME.pid]&&D.res[ME.pid][q.id],isNew=!cl&&!SEEN[q.id];
let body="";const sel=(v)=>a!=null&&String(a)===String(v);
const cls=(v)=>{if(q.av!=null&&q.a!=="Annulé"){const good=Array.isArray(q.av)?q.av.map(String).includes(String(v)):String(q.av)===String(v);if(good)return" ok";if(sel(v))return" ko"}return sel(v)?" on":""};
if(q.k=="team"&&q.o.length>5){body=`<select ${cl?"disabled":""} style="font-size:16px;padding:13px;${a!=null&&a!==""?"background:#e9e5ff;font-weight:800":""}" onchange="setA('${q.id}',this.value===''?'':+this.value)"><option value="">Choisir une équipe…</option>${q.o.map(o=>`<option value="${o[0]}"${sel(o[0])?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`}
else if(q.k=="team"||q.k=="ch"){body=`<div class="os${q.k=="team"?" col":""}">${q.o.map(o=>`<button class="o${cls(o[0])}" ${cl?"disabled":""} onclick="setA('${q.id}',${JSON.stringify(o[0]).replace(/"/g,"&quot;")})">${esc(o[1])}</button>`).join("")}</div>`}
else if(q.k=="bet"){const [w,e]=String(a??"").split("|"),aw=q.av!=null?String(q.av).split("|")[0]:null;body=`<div class="os col">${q.o.map(o=>`<button class="o${aw!=null&&q.a!=="Annulé"?(String(o[0])==aw?" ok":(w===String(o[0])?" ko":"")):(w===String(o[0])?" on":"")}" ${cl?"disabled":""} onclick="setA('${q.id}','${o[0]}|${e||""}')">${esc(o[1])}</button>`).join("")}</div>${w!==undefined&&w!==""?`<div class="qm" style="margin:10px 0 6px">Bonus : écart de jeux ?</div><div class="os">${[["a","1 ou 2"],["b","3 à 5"],["c","6 et plus"]].map(x=>`<button class="o${e==x[0]?" on":""}" ${cl?"disabled":""} onclick="setA('${q.id}','${w}|${x[0]}')">${x[1]}</button>`).join("")}</div>`:""}`}
else if(q.k=="num"){body=`<div class="ni"><input type="number" inputmode="numeric" ${cl?"disabled":""} value="${a??""}" onchange="setA('${q.id}',this.value)"><span>${esc(q.u||"")}</span></div>`}
else if(q.k=="time"){body=`<div class="ni"><input type="time" ${cl?"disabled":""} value="${a??""}" onchange="setA('${q.id}',this.value)"></div>`}
else if(q.k=="score"){body=`<div class="ni"><input type="text" inputmode="text" placeholder="9-6" ${cl?"disabled":""} value="${esc(a??"")}" onchange="setA('${q.id}',this.value)"></div>`}
else if(q.k=="top"){const v=Array.isArray(a)?a:[];body=[...Array(q.n)].map((_,k)=>`<select ${cl?"disabled":""} onchange="setTop('${q.id}',${k},this.value,${q.n})"><option value="">${k+1}${k?"e":"er"} : choisir…</option>${q.o.map(o=>`<option value="${o[0]}"${String(v[k])===String(o[0])?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`).join("")}
const meta=`<div class="qm"><span>${q.pts} pt${q.pts>1?"s":""}</span><span>${cl?"🔒 fermé":"⏳ "+esc(q.ct||"")}</span>${q.no?`<span>${esc(q.no)}</span>`:""}</div>`;
const res=q.a!=null?`<div class="res${got?" g":""}">${q.a==="Annulé"?"Question annulée":"Réponse : "+esc(q.a)} ${got?"· ✅ +"+got+" pt"+(got>1?"s":""):(a!=null&&a!==""?"· raté":"")}</div>`:(cl&&(a==null||a==="")?`<div class="res">Tu n’as pas répondu à temps</div>`:"");
return `<div class="q${isNew?" new":""}"><div class="qt">${esc(q.t)}</div>${meta}${body}${res}</div>`}

if(!ME){app.innerHTML=`<div class="box"><h1>Bienvenue ! 🎮</h1><p>Pronostique le tournoi <b style="color:#fff">${esc(D.t||D.cat||"")}</b>, parie sur les matchs et grimpe au classement du jour.</p><input id="nm" placeholder="Ton prénom (et l’initiale de ton nom)" maxlength="30" autocomplete="given-name"><button class="btn" onclick="join()">C’est parti !</button></div>`;$("#tabs").style.display="none";return}
const m=mine(),Q=D.q,pro=Q.filter(q=>q.k!="bet"),bets=Q.filter(q=>q.k=="bet"),openBets=bets.filter(q=>!q.cl).sort((a,b)=>(b.nx||0)-(a.nx||0)),doneBets=bets.filter(q=>q.cl&&q.a!=null).reverse().slice(0,10);
const nP=pro.filter(q=>!q.cl&&(ANS[q.id]==null||ANS[q.id]==="")).length,nB=openBets.filter(q=>ANS[q.id]==null).length;
$("#tabs").style.display="flex";$("#tabs").innerHTML=[["pro","🔮","Pronos",nP],["bet","⚡","Paris",nB],["jeu","🎮","Mini-jeux",0],["lb","🏆","Classement",0]].map(([k,i,l,n])=>`<button class="${TAB==k?"on":""}" onclick="TAB='${k}';render();scrollTo(0,0)"><b>${i}</b>${l}${n?`<span class="dot">${n}</span>`:""}</button>`).join("");

function jeuHtml(){const p=best("g_p34"),q=best("g_quiz"),r=best("g_ref");
return `<p>Joue en attendant ton match : les meilleurs du jour gagnent des points bonus au classement !</p>
<div class="gm" onclick="startP34()"><i>⛳</i><div><b>Par 3 / Par 4</b><small>Fais sortir la balle au smash : par le côté (par 3) ou par le grillage du fond (par 4). 10 balles.</small>${mini("p34"," pts")}</div><em>${p!=null?"Record<br>"+p+" pts":"Jouer"}</em></div>
<div class="gm" onclick="startQuiz()"><i>🧠</i><div><b>Quiz arbitre</b><small>10 questions sur les règles du padel. Une seule tentative !</small>${mini("quiz","/10")}</div><em>${q!=null?q+"/10":"Jouer"}</em></div>
<div class="gm" onclick="startRef()"><i>⏱️</i><div><b>Réflexe volée</b><small>Touche l’écran dès que la balle arrive. 5 essais, ton meilleur temps compte.</small>${mini("ref"," ms")}</div><em>${r!=null?"Record<br>"+r+" ms":"Jouer"}</em></div>
<p class="qm"><span>🥇 +3 pts</span><span>🥈 +2 pts</span><span>🥉 +1 pt</span><span>Quiz : 1 pt par 2 bonnes réponses</span></p>`}
function quitG(){cancelAnimationFrame(raf);clearTimeout(GM&&GM.to);GM=null;TAB="jeu";render();scrollTo(0,0)}
function gameHtml(){if(GM.k=="p34")return p34Html();if(GM.k=="quiz")return quizHtml();return refHtml()}
/* --- Par 3 / Par 4 --- */
function startP34(){GM={k:"p34",ball:1,score:0,streak:0,dir:"f",ph:"aim",wind:0,msg:null};newWind();render();scrollTo(0,0)}
function newWind(){GM.wind=Math.round((Math.random()*2-1)*8)/100}
const SW=()=>{const c=.72+GM.wind,w=GM.dir=="f"?.09:.14;return{c,w}};
function p34Html(){const g=GM,{c,w}=SW(),dl={g:"← Côté gauche",f:"↑ Grillage du fond",d:"Côté droit →"};
let h=`<div class="hud"><span>Balle ${Math.min(g.ball,10)} / 10</span><span>Score ${g.score}</span><span>${g.streak?"🔥 x2":"💨 "+(g.wind>0?"+":"")+Math.round(g.wind*100)}</span></div>`;
h+=`<svg viewBox="0 0 360 300" width="100%" style="display:block;border-radius:16px;background:linear-gradient(#183a7a,#0f2350)"><rect x="0" y="262" width="360" height="38" fill="#1f6fb5"/><rect x="176" y="236" width="5" height="26" fill="#fff"/>
<rect x="6" y="${g.dir=="f"?150:150}" width="10" height="112" fill="rgba(190,230,255,.6)"/><rect x="340" y="${g.dir=="f"?150:150}" width="12" height="112" fill="rgba(190,230,255,.6)"/>
${g.dir=="f"?`<g stroke="#9aa7c7" stroke-width="2"><line x1="346" y1="150" x2="346" y2="70"/></g><text x="292" y="66" fill="#c6f432" font-size="14" font-weight="900">4 m</text>`:`<text x="270" y="144" fill="#f59e0b" font-size="14" font-weight="900">3 m</text>`}
<circle cx="60" cy="246" r="11" fill="#ff4fa3" stroke="#fff" stroke-width="3"/><text x="44" y="226" fill="#fff" font-size="12" font-weight="800">toi</text>
<circle id="bl" cx="70" cy="226" r="9" fill="#e9ff5a" stroke="#fff" stroke-width="3"/></svg>`;
if(g.ph=="end"){h+=`<div class="bigr ok">${g.score} pts</div><p style="text-align:center">${g.score>=30?"Énorme ! Tu as le bras d’un pro 💪":g.score>=15?"Belle partie ! 👏":"Pas mal, réessaie pour battre ton record !"}${best("g_p34")!=null?"<br>Ton record : "+best("g_p34")+" pts":""}</p><button class="btn" onclick="startP34()">🔁 Rejouer</button><button class="btn" style="background:none;color:var(--mu);margin-top:6px" onclick="quitG()">← Retour aux jeux</button>`;return h}
if(g.msg)h+=`<div class="bigr ${g.msg.ok?"ok":"ko"}">${g.msg.t}</div><p style="text-align:center;margin:0 0 8px">${g.msg.s}</p>`;
if(g.ph=="aim"||g.ph=="res"){h+=`<div class="dirs">${["g","f","d"].map(x=>`<button class="${g.dir==x?"on":""}" onclick="GM.dir='${x}';render()">${dl[x]}<br><small style="font-weight:600;color:var(--mu)">${x=="f"?"par 4 · 4 pts":"par 3 · 3 pts"}</small></button>`).join("")}</div><button class="btn" onclick="goPow()">🎾 Smasher la balle ${g.ball}</button>`}
else if(g.ph=="pow"){h+=`<p style="margin:10px 0 0;text-align:center">Touche <b>STOP</b> quand le curseur est dans le <b>cadre blanc</b></p><div class="pw"><div class="sw" style="left:${(c-w/2)*100}%;width:${w*100}%"></div><div class="cur" id="cur" style="left:0%"></div></div><button class="btn" style="padding:22px;font-size:24px" onclick="stopPow()">STOP</button>`}
h+=`<button class="btn" style="background:none;color:var(--mu);margin-top:8px" onclick="quitG()">← Quitter</button>`;return h}
function goPow(){GM.ph="pow";GM.msg=null;render();const t0=performance.now(),sp=1.1+GM.ball*.06;const step=t=>{const x=((t-t0)/1000*sp)%2,p=x<1?x:2-x;GM.p=p;const e=document.getElementById("cur");if(e)e.style.left=(p*100)+"%";raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
function stopPow(){if(GM.ph!="pow")return;cancelAnimationFrame(raf);const p=GM.p||0,{c,w}=SW(),d=Math.abs(p-c);let out;
if(d<=w/2){const pts=(GM.dir=="f"?4:3)*(GM.streak?2:1);out={ok:1,t:GM.dir=="f"?"PAR 4 !":"PAR 3 !",s:(GM.dir=="f"?"La balle passe au-dessus du grillage du fond":"La balle sort par le côté")+" : +"+pts+" pts"+(GM.streak?" (série x2 🔥)":""),pts,h:GM.dir=="f"?20:40}}
else if(p<c-w/2-.25)out={ok:0,t:"Dans le filet 😬",s:"Pas assez de puissance.",pts:0,h:250}
else if(p>c+w/2+.12)out={ok:0,t:"Dehors direct ❌",s:"Trop fort : la balle touche le grillage sans rebondir.",pts:0,h:-1}
else out={ok:0,t:"Reste sur la piste",s:p<c?"Il manquait un peu de puissance : l’adversaire la reprend.":"Un peu trop fort… la balle ne sort pas.",pts:0,h:150};
GM.ph="anim";render();animBall(out,()=>{GM.score+=out.pts;GM.streak=out.ok?1:0;GM.msg=out;GM.ball++;newWind();if(GM.ball>10){GM.ph="end";sendG("g_p34",GM.score,(a,b)=>a>b)}else GM.ph="res";render()})}
function animBall(o,done){const b=document.getElementById("bl");if(!b){done();return}const t0=performance.now(),D1=520,D2=620,ex=o.h===-1;const bx=ex?345:250;
const f=t=>{const k=(t-t0);if(k<D1){const u=k/D1;b.setAttribute("cx",70+(bx-70)*u);b.setAttribute("cy",226-90*Math.sin(Math.PI*u)+(ex?-60*u:36*u));raf=requestAnimationFrame(f);return}
if(!ex&&o.h!=250&&k<D1+D2){const u=(k-D1)/D2,top=o.h;b.setAttribute("cx",250+110*u);b.setAttribute("cy",262-(262-top)*Math.sin(Math.PI/2*u)-(o.ok?40*u:0));raf=requestAnimationFrame(f);return}
if(o.h==250&&k<D1+300){b.setAttribute("cx",178);b.setAttribute("cy",250);raf=requestAnimationFrame(f);return}done()};raf=requestAnimationFrame(f)}
/* --- Quiz arbitre --- */
const QZ=[["Le service se joue…",["Au-dessus de la tête","À hauteur de la taille ou en dessous","Comme on veut"],1,"La balle doit être frappée à hauteur de la taille ou en dessous, après un rebond au sol."],
["Combien de balles de service a-t-on ?",["1","2","3"],1,"Comme au tennis : deux services."],
["Avant de servir, la balle doit…",["Rebondir au sol derrière la ligne de service","Être lancée en l’air","Toucher la vitre"],0,"Le serveur fait rebondir la balle au sol, derrière la ligne de service, avant de la frapper."],
["Le service touche le filet, tombe dans le bon carré puis touche le grillage avant le 2e rebond :",["On remet le service (let)","Faute","Point pour le serveur"],1,"Si la balle touche le grillage après le filet et le rebond, c’est faute (pas de let)."],
["Le service rebondit dans le bon carré puis touche la vitre du fond :",["Bon service","Faute","On rejoue"],0,"Le service est bon : la vitre fait partie du jeu après le rebond."],
["Une balle frappée touche directement la vitre adverse sans rebondir au sol :",["Elle est bonne","Point perdu pour celui qui l’a frappée","On rejoue le point"],1,"La balle doit d’abord rebondir au sol dans le camp adverse."],
["Peut-on renvoyer la balle en la frappant contre sa propre vitre ?",["Oui","Non","Seulement au service"],0,"Oui ! C’est un coup typique du padel."],
["La raquette touche le filet pendant le point :",["Rien de spécial","Point perdu","On rejoue"],1,"Toucher le filet (raquette, corps ou vêtement) pendant le point fait perdre le point."],
["Après le rebond chez toi, la balle tape la vitre puis revient : tu peux…",["La jouer avant le 2e rebond","Seulement la laisser","Demander un let"],0,"Tant qu’elle n’a pas rebondi deux fois au sol, la balle est jouable, même après la vitre."],
["Un set classique se gagne…",["En 6 jeux avec 2 jeux d’écart (tie-break à 6-6)","En 4 jeux secs","En 9 jeux"],0,"Format classique : 6 jeux, 2 d’écart, tie-break à 6-6 (les tournois utilisent aussi des formats courts)."]];
function startQuiz(){if(best("g_quiz")!=null){alert("Tu as déjà fait le quiz aujourd’hui : "+best("g_quiz")+"/10 !");return}GM={k:"quiz",i:0,ok:0,a:null};render();scrollTo(0,0)}
function quizHtml(){const g=GM;if(g.i>=QZ.length)return `<div class="bigr ok">${g.ok}/10</div><p style="text-align:center">${g.ok>=9?"Digne d’un juge-arbitre ! 🧑‍⚖️":g.ok>=6?"Très bien ! 👏":"Il faut réviser le règlement 😉"}<br>+${Math.floor(g.ok/2)} pts au classement du jour</p><button class="btn" onclick="quitG()">← Retour aux jeux</button>`;
const q=QZ[g.i];return `<div class="hud"><span>Question ${g.i+1} / 10</span><span>✅ ${g.ok}</span></div><div class="qz">${esc(q[0])}</div><div class="os col">${q[1].map((o,k)=>`<button class="o${g.a!=null?(k==q[2]?" ok":k==g.a?" ko":""):""}" ${g.a!=null?"disabled":""} onclick="qzA(${k})">${esc(o)}</button>`).join("")}</div>${g.a!=null?`<div class="ex">${g.a==q[2]?"✅ Bravo ! ":"❌ "}${esc(q[3])}</div><button class="btn" style="margin-top:12px" onclick="GM.i++;GM.a=null;render()">${g.i<9?"Question suivante →":"Voir mon score"}</button>`:""}`}
function qzA(k){if(GM.a!=null)return;GM.a=k;if(k==QZ[GM.i][2])GM.ok++;if(GM.i==QZ.length-1)sendG("g_quiz",GM.ok,()=>false);render()}
/* --- Réflexe volée --- */
function startRef(){GM={k:"ref",n:0,bestv:null,st:"idle",msg:"Touche pour commencer"};render();scrollTo(0,0)}
function refHtml(){const g=GM,bg=g.st=="go"?"#c6f432":g.st=="wait"?"#7a2b2b":"rgba(255,255,255,.08)",col=g.st=="go"?"#0a1020":"#fff";
if(g.n>=5&&g.st=="idle")return `<div class="bigr ok">${g.bestv!=null?g.bestv+" ms":"—"}</div><p style="text-align:center">Ton meilleur temps sur 5 essais${best("g_ref")!=null?"<br>Ton record : "+best("g_ref")+" ms":""}</p><button class="btn" onclick="startRef()">🔁 Rejouer</button><button class="btn" style="background:none;color:var(--mu);margin-top:6px" onclick="quitG()">← Retour aux jeux</button>`;
return `<div class="hud"><span>Essai ${Math.min(g.n+1,5)} / 5</span><span>Meilleur ${g.bestv!=null?g.bestv+" ms":"—"}</span></div><div class="rf" style="background:${bg};color:${col}" ontouchstart="refTap(event)" onmousedown="refTap(event)">${g.st=="go"?"🎾 TAPE !":esc(g.msg)}</div><p style="text-align:center;margin-top:10px">Attends que l’écran devienne <b style="color:var(--lime)">vert fluo</b>, puis touche le plus vite possible.</p><button class="btn" style="background:none;color:var(--mu)" onclick="quitG()">← Quitter</button>`}
function refTap(e){e.preventDefault();const g=GM;if(g.st=="idle"){g.st="wait";g.msg="Attends…";render();g.to=setTimeout(()=>{g.st="go";g.t0=performance.now();render()},1200+Math.random()*2300);return}
if(g.st=="wait"){clearTimeout(g.to);g.st="idle";g.msg="Trop tôt ! 😅 Touche pour réessayer";g.n++;render();if(g.n>=5)fin();return}
if(g.st=="go"){const ms=Math.round(performance.now()-g.t0);g.bestv=g.bestv==null?ms:Math.min(g.bestv,ms);g.st="idle";g.n++;g.msg=ms+" ms ! Touche pour l’essai suivant";render();if(g.n>=5)fin()}}
function fin(){if(GM.bestv!=null&&GM.bestv>=80)sendG("g_ref",GM.bestv,(a,b)=>a<b);render()}

load();setInterval(()=>{if(document.visibilityState=="visible")load()},15000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible")load()});
</script></body></html>
