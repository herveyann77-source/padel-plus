<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Padel+ · Envoyer le score</title><meta name="robots" content="noindex"><meta name="theme-color" content="#141c4a">
<style>
:root{--ink:#141c4a;--lime:#b6ef2a;--blue:#2a4bc4;--tx:#141c4a;--mu:#5a6690;--line:#dfe4f3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:#eef1fb;display:flex;justify-content:center;padding:18px 14px 40px}
.c{width:100%;max-width:480px}.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hd img{width:52px;height:52px;border-radius:14px}.hd b{font-size:22px}.hd small{display:block;color:var(--mu);font-weight:600;font-size:14px}
.box{background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(20,28,74,.10)}
h1{font-size:21px;margin:0 0 6px}p{margin:0 0 12px;color:var(--mu);line-height:1.45}
.lab{display:inline-block;background:#eef1fb;color:var(--mu);font-weight:800;font-size:13px;border-radius:99px;padding:4px 12px;margin-bottom:10px}
.b{display:block;width:100%;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;font-weight:800;margin:0 0 10px;background:#fff;color:var(--tx);cursor:pointer;text-align:left;line-height:1.35}
.b small{display:block;color:var(--mu);font-weight:700;font-size:13px}.b:active{transform:scale(.98)}
.go{background:var(--lime);border-color:var(--lime);color:var(--ink);text-align:center;font-size:19px}.ln{background:none;border:0;color:var(--mu);font-size:15px;text-align:center;font-weight:700}
.set{margin:14px 0}.set h3{margin:0 0 8px;font-size:15px;color:var(--mu)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tm{border:2px solid var(--line);border-radius:14px;padding:10px}.tm.me{border-color:var(--blue);background:#eaf0ff}
.tm b{display:block;font-size:13px;line-height:1.3;min-height:34px}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.nums button{border:0;border-radius:10px;padding:10px 0;font-size:18px;font-weight:900;background:#eef1fb;color:var(--tx)}.nums button.on{background:var(--ink);color:var(--lime)}
.sum{font-size:30px;font-weight:900;text-align:center;margin:10px 0}.big{font-size:56px;text-align:center;margin:4px 0}.err{color:#c92a2a;font-weight:700}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:16px}
.pn{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm b{min-height:0}.vous{display:inline-block;background:#2a4bc4;color:#fff;font-size:11px;border-radius:8px;padding:1px 8px;margin-bottom:3px}
.row{align-items:stretch;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}.tm{min-width:0}.tm{display:flex;flex-direction:column}.tm .nums{margin-top:auto;padding-top:8px}
.tm.me .nums button{background:#fff;box-shadow:0 0 0 1px #c9d4f5 inset}.tm.me .nums button.on{background:var(--ink);box-shadow:none}
.wb{display:flex;align-items:center;gap:14px}.wb .wc{font-size:30px;flex:none;width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid #ffcf3f;display:flex;align-items:center;justify-content:center}.wb .wn{flex:1;min-width:0}
.wbox{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#fff1c2,#fff);border-radius:16px;padding:12px;margin:0 0 14px;font-weight:800}.wbox>div{flex:1;min-width:0}.wbox .wc{font-size:24px}
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}.qs button{border:2px solid var(--line);border-radius:14px;padding:16px 0;font-size:24px;font-weight:900;background:#fff;color:var(--tx)}.qs button.on{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.vidl{display:block;width:100%;margin-top:14px;border:2px dashed #c4cae0;background:#fff;border-radius:14px;padding:12px;font-weight:800;font-size:16px;color:#141c4a;text-align:center}.vidl small{font-weight:600;color:#5b6280}.vidov{position:fixed;inset:0;background:rgba(5,8,31,.8);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}.vidbx{width:min(380px,100%);text-align:center}.vidbx video{width:100%;max-height:78vh;border-radius:18px;background:#000}.vidbx button{margin-top:12px;background:#b6ef2a;color:#141c4a;border:0;border-radius:14px;padding:12px 22px;font-weight:900;font-size:16px}
.ph{margin:0 0 14px;border:2px solid var(--line);border-radius:16px;overflow:hidden}.ph h3{margin:0;padding:8px 12px;background:#eef1fb;font-size:13px;color:var(--mu);letter-spacing:.04em}.pr{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}.pr:first-of-type{border-top:0}.pr .pn2{flex:1;min-width:0}.pr .pn2 span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}.pr .pn2 span.w{font-weight:900}.pr .pn2 span.l{color:var(--mu)}.pr .mn{flex:none;width:24px;height:24px;border-radius:50%;background:#eef1fb;color:var(--mu);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}.pr .sc2{flex:none;font-weight:900;font-size:16px;background:var(--ink);color:#ffcf3f;border-radius:8px;padding:3px 8px}.pr.cur{background:#fff7d6}.pr.cur .mn{background:var(--ink);color:var(--lime)}.pr .tg2{flex:none;font-size:11px;font-weight:900;background:var(--lime);color:var(--ink);border-radius:99px;padding:3px 8px}.pr.fut{opacity:.45}button.pr{width:100%;border:0;border-top:1px solid var(--line);background:#fff;text-align:left;font-family:inherit;color:var(--tx);padding:12px;cursor:pointer}button.pr:disabled{cursor:default;opacity:1}button.pr.go2{background:#fffbe8}.pr .sn{flex:none;text-align:right;font-weight:900;font-size:14px;color:#8a6a00}.pr .sn small{display:block;font-size:11px;color:var(--mu);font-weight:700}.b.wb.won{border-color:var(--ink);background:#fff1c2}.b.wb.won .wc{background:#ffcf3f}.hint{text-align:center;color:var(--mu);font-weight:700;margin:6px 0 4px}.qt{border:2px solid var(--line);border-radius:16px;padding:10px;margin:0 0 10px}.qt.on{border-color:var(--ink);background:#fffbe8}.qn{font-weight:800;font-size:15px;margin:0 0 6px;line-height:1.3}.qt .qs{margin:0;gap:6px}.qt .qs button{padding:11px 0;font-size:19px}.okm{background:#eaf7ee;color:#1c7a45;font-weight:800;border-radius:12px;padding:10px 12px;margin:0 0 12px}.pr .pn2 span{font-size:14px}
</style></head><body><div class="c"><div class="hd"><img src="icon-192.png" alt=""><div><b>Padel+</b><small id="tt">Envoyer le score</small></div></div><div class="box" id="m"><p>Chargement…</p></div><div class="ft">Le juge-arbitre peut toujours corriger le score.</div></div>
<script>
function vidOpen(n){const o=document.createElement("div");o.className="vidov";o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML=`<div class="vidbx"><video src="aide/${n}.mp4" controls autoplay playsinline muted></video><button onclick="this.closest('.vidov').remove()">✕ Fermer</button></div>`;document.body.appendChild(o)}
const Q=new URLSearchParams(location.search),$=id=>document.getElementById(id),m=$("m");
const ref=Q.get("r")||"",own=Q.get("o")||"",court=+(Q.get("c")||0),ck=Q.get("ck")||"",key=Q.get("k")||"";
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const API="https://"+ref+".supabase.co/rest/v1/",H={"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json"};
let D=null,team=null,SC=[];
const sentK=pk=>"pp_sc_"+pk;
async function load(){if(!ref||!own||!court||!ck||!key){m.innerHTML='<h1>QR code incomplet</h1><p class="err">Ce QR code ne fonctionne pas. Donne ton score au juge-arbitre.</p>';return}
m.innerHTML="<p>Chargement…</p>";
try{const r=await fetch(API+"rpc/court_get",{method:"POST",headers:H,body:JSON.stringify({o:own,c:court,kk:ck})});if(!r.ok)throw new Error("Erreur "+r.status);D=await r.json()}catch(e){m.innerHTML='<h1>Pas de connexion</h1><p class="err">'+esc(e.message)+'</p><button class="b go" onclick="load()">Réessayer</button>';return}
$("tt").textContent="Piste "+court+(D&&D.t?" · "+D.t:"");
if(!D||D.none||!D.pk){m.innerHTML='<div class="big">🎾</div><h1>Piste '+court+'</h1><p>Aucun match en cours sur cette piste pour l’instant.<br>Le juge-arbitre doit d’abord lancer votre match.</p><button class="b go" onclick="load()">🔄 Actualiser</button>';return}
BASE=Object.assign({},D);if(D.pl&&D.pl.length>1)return poolList();
let done=null;try{done=localStorage.getItem(sentK(D.pk))}catch(e){}if(done)return thanks(true);
team=null;SC=Array.from({length:D.n||1},()=>["",""]);if((D.n||1)==1)return quick();draw()}
function pick(){m.innerHTML='<span class="lab">Piste '+court+' · '+esc(D.lab)+'</span><h1>Quelle est ton équipe ?</h1><p>Touche <b>ton</b> équipe.</p>'+[0,1].map(i=>'<button class="b" onclick="choose('+i+')">'+pn(D[i?"b":"a"])+'</button>').join("")+'<button class="b ln" onclick="'+(BASE&&BASE.pl&&BASE.pl.length>1?'backList()':'load()')+'">'+(BASE&&BASE.pl&&BASE.pl.length>1?'← Revenir aux matchs':'🔄 Ce n’est pas notre match')+'</button><button class="vidl" onclick="vidOpen(\'envoyer-score\')">🎬 Comment faire ? <small>vidéo de 28 s</small></button>'}
function choose(i){team=i;try{localStorage.setItem(meK,JSON.stringify(D[i?"b":"a"]))}catch(e){}SC=Array.from({length:D.n||1},()=>["",""]);if((D.n||1)==1)return quick();draw()}
/* n°683 : comme dans Padel+ : d’abord « Qui a gagné ? », puis les jeux de l’équipe qui a perdu (match en 1 set) */
let WIN=null;
/* n°709 (demande de Yann) : toute la poule dans l’ordre ; le joueur touche le match qui vient d’avoir lieu, entre le score,
   puis revient à la liste : les scores déjà entrés restent affichés. Plus de question sur l’équipe : le score part directement (décision de Yann, n°709). */
const VIDB='<button class="vidl" onclick="vidOpen(\'envoyer-score\')">🎬 Comment faire ? <small>vidéo</small></button>';
const sh=n=>(n||"").split(" ")[0];let BASE=null;
const sentOf=pk=>{try{return JSON.parse(localStorage.getItem(sentK(pk))||"null")}catch(e){return null}};
function poolList(msg){const P=D.pl,g=(BASE.lab||"").split(" · ")[0];let h='<span class="lab">Piste '+court+' · '+esc(g)+'</span>'+(msg||"")+'<h1>Touche le match qui vient d’avoir lieu</h1><p>Puis touche le gagnant et son score.</p><div class="ph">';
P.forEach((x,k)=>{const sn=x.w==null?sentOf(x.pk):null,nm=(L,i)=>'<span class="'+(x.w==null?"":x.w===i?"w":"l")+'">'+(x.w===i?"🏆 ":"")+esc((L||[]).map(sh).join(" / "))+'</span>';
h+='<button class="pr'+(x.w==null&&!sn?" go2":"")+'" '+(x.w==null?'onclick="openM('+k+')"':'disabled')+'><span class="mn">'+(x.n||k+1)+'</span><div class="pn2">'+nm(x.a,0)+nm(x.b,1)+'</div>'+(x.w!=null?'<span class="sc2">'+esc(x.s)+'</span>':sn?'<span class="sn">⏳ '+esc(sn.map(q=>q[0]+"-"+q[1]).join(" "))+'<small>envoyé</small></span>':'<span class="tg2">Entrer le score ›</span>')+'</button>'});
m.innerHTML=h+'</div><button class="b ln" onclick="load()">🔄 Actualiser</button>'+VIDB}
function openM(k){const x=D.pl[k];D=Object.assign({},BASE,{pk:x.pk,a:x.a,b:x.b,lab:(BASE.lab||"").split(" · ")[0]+" · Match "+(x.n||k+1),pl:BASE.pl});team=null;SC=[["",""]];if((D.n||1)==1)return quick();draw()}
function backList(msg){D=Object.assign({},BASE);poolList(msg)}
/* n°709 : moins d’étapes : l’équipe est retenue par le téléphone ; « qui a gagné » + score sur un seul écran */
const meK="pp_me_team";const meGet=()=>{try{return JSON.parse(localStorage.getItem(meK)||"null")}catch(e){return null}};
const same=(x,y)=>JSON.stringify((x||[]).slice().sort())===JSON.stringify((y||[]).slice().sort());
function autoTeam(){const me=meGet();if(!me)return null;if(same(D.a,me))return 0;if(same(D.b,me))return 1;return null}
function quick(){WIN=null;QS=null;SC=[["",""]];quickDraw()}
function quickDraw(){const L=preL(),cur=WIN!=null&&SC[0][WIN]!==""?SC[0][WIN]+"-"+SC[0][1-WIN]:"",sel=SC[0][WIN==null?0:WIN]!==""?SC[0][WIN==null?0:WIN]+"-"+SC[0][WIN==null?1:1-WIN]:"";
let h='<span class="lab">Piste '+court+' · '+esc(D.lab)+'</span><h1>Qui a gagné ?</h1><p>Touche le vainqueur.</p>'+[0,1].map(x=>'<button class="b wb'+(WIN===x?" won":"")+'" onclick="qWin('+x+')"><span class="wc">🏆</span><span class="wn">'+pn(D[x?"b":"a"])+'</span></button>').join("");
h+='<h1 style="margin-top:16px">Le score</h1><div class="qs">'+L.map(p=>'<button class="'+(QS&&QS[0]==p[0]&&QS[1]==p[1]?"on":"")+'" onclick="qSc('+p[0]+','+p[1]+')">'+p[0]+'-'+p[1]+'</button>').join("")+'</div>';
if(cur)h+='<button class="b go" id="gb" onclick="send()">✅ Envoyer : '+esc((D[WIN?"b":"a"]||[]).map(sh).join(" / "))+' gagne '+cur+'</button>';else h+='<p class="hint">'+(WIN==null?"Touche le vainqueur, puis le score.":"Touche le score.")+'</p>';
h+='<button class="b ln" onclick="'+(BASE&&BASE.pl&&BASE.pl.length>1?'backList()':'load()')+'">← Revenir</button>';m.innerHTML=h;if(cur){const g=$("gb");g&&g.scrollIntoView({block:"nearest",behavior:"smooth"})}}
let QS=null;function qWin(x){WIN=x;if(QS){SC=[["",""]];SC[0][x]=String(QS[0]);SC[0][1-x]=String(QS[1])}quickDraw()}
function qSc(a,b){QS=[a,b];SC=[["",""]];const x=WIN==null?0:WIN;SC[0][x]=String(a);SC[0][1-x]=String(b);quickDraw()}
function qSet(x,a,b){WIN=x;QS=[a,b];SC=[["",""]];SC[0][x]=String(a);SC[0][1-x]=String(b);quickDraw()}
function winS(){WIN=null;m.innerHTML='<span class="lab">Piste '+court+' · '+esc(D.lab)+'</span><h1>Qui a gagné ?</h1><p>Touche l’équipe qui a gagné le match.</p>'+[0,1].map(x=>'<button class="b wb" onclick="pickW('+x+')"><span class="wc">🏆</span><span class="wn">'+(x==team?'<span class="vous">Vous</span>':'')+pn(D[x?"b":"a"])+'</span></button>').join("")+'<button class="b ln" onclick="pick()">← Changer d’équipe</button>'}
function pickW(x){WIN=x;const L=preL(),lo=1-x,cur=SC[0][x]!==""?SC[0][x]+"-"+SC[0][lo]:"";let h='<span class="lab">Piste '+court+' · '+esc(D.lab)+'</span><div class="wbox"><span class="wc">🏆</span><div>'+pn(D[x?"b":"a"])+'</div></div><h1>Le score</h1><p>Touche le score du match.</p><div class="qs">';
L.forEach(p=>{h+='<button class="'+(cur==p[0]+"-"+p[1]?"on":"")+'" onclick="setL('+p[0]+','+p[1]+')">'+p[0]+'-'+p[1]+'</button>'});
h+='</div>'+(cur?'<button class="b go" id="gb" onclick="send()">✅ Envoyer '+cur+'</button>':'')+'<button class="b ln" onclick="winS()">← Changer le vainqueur</button>';m.innerHTML=h}
/* scores tout faits, comme dans Padel+ : 9-0 … 9-8 (6-0 … 7-6 en 7 jeux, 4-0 … 5-4 en 5 jeux) */
function preL(){const M=(D.mx||[9])[0]??9;if(M==7)return [[6,0],[6,1],[6,2],[6,3],[6,4],[7,5],[7,6]];if(M==5)return [[4,0],[4,1],[4,2],[5,4]];const L=[];for(let l=0;l<M;l++)L.push([M,l]);return L}
function setL(a,b){SC[0][WIN]=String(a);SC[0][1-WIN]=String(b);pickW(WIN)}
function nums(s,x){const mx=(D.mx||[9])[s]??9,v=SC[s][x];let h="";for(let k=0;k<=mx;k++)h+='<button class="'+(String(k)===v?"on":"")+'" onclick="setv('+s+','+x+','+k+')">'+k+'</button>';return h}
function setv(s,x,k){SC[s][x]=String(k);draw()}
function draw(){const n=D.n||1;let h='<span class="lab">Piste '+court+' · '+esc(D.lab)+'</span><h1>Le score</h1><p>Touche le nombre de jeux de chaque équipe.</p>';
for(let s=0;s<n;s++){h+='<div class="set">'+(n>1?'<h3>'+esc((D.sl||[])[s]||("Set "+(s+1)))+'</h3>':'')+'<div class="row">'+[0,1].map(x=>'<div class="tm'+(x==team?" me":"")+'"><b>'+(x==team?'<span class="vous">Vous</span>':'')+pn(D[x?"b":"a"])+'</b><div class="nums">'+nums(s,x)+'</div></div>').join("")+'</div></div>'}
const okS=SC.filter(q=>q[0]!==""&&q[1]!=="");h+='<div class="sum">'+(okS.length?okS.map(q=>q[0]+" - "+q[1]).join("  "):"–")+'</div>';
h+='<button class="b go" id="gb" onclick="send()" '+(okS.length?"":"disabled style=\"opacity:.45\"")+'>✅ Envoyer ce score</button><button class="b ln" onclick="pick()">← Changer d’équipe</button>';m.innerHTML=h}
async function send(){const sc=SC.filter(q=>q[0]!==""&&q[1]!=="").map(q=>[+q[0],+q[1]]);if(!sc.length)return;const b=$("gb");b.disabled=true;b.textContent="Envoi…";
try{const r=await fetch(API+"padel_score",{method:"POST",headers:{...H,"Prefer":"return=minimal"},body:JSON.stringify({owner:own,court,k:ck,pk:D.pk,team:team==null?0:team,sc})});if(!r.ok)throw new Error("Erreur "+r.status);
try{localStorage.setItem(sentK(D.pk),JSON.stringify(sc))}catch(e){}thanks(false,sc)}catch(e){b.disabled=false;b.textContent="✅ Réessayer";m.insertAdjacentHTML("beforeend",'<p class="err">Le score n’est pas parti ('+esc(e.message)+'). Vérifie ta connexion et réessaie, ou donne-le au juge-arbitre.</p>')}}
function thanks(again,sc){if(BASE&&BASE.pl&&BASE.pl.length>1&&!again)return backList('<div class="okm">✅ Score envoyé. Le juge-arbitre le reçoit tout de suite.</div>');m.innerHTML='<div class="big">✅</div><h1>'+(again?"Score déjà envoyé":"Merci, score envoyé !")+'</h1><p>Le juge-arbitre le reçoit tout de suite. En cas d’erreur, il le corrige.</p><button class="b ln" onclick="try{localStorage.removeItem(sentK(D.pk))}catch(e){};pick()">✏️ Corriger notre envoi</button>'}
/* n°682 : un joueur par ligne, NOM et prénom côte à côte ; trop long : prénom en initiale, puis texte un peu plus petit */
const pn=L=>(L||[]).map(n=>'<span class="pn">'+esc(n)+'</span>').join("");
function pfit(){document.querySelectorAll(".pn").forEach(e=>{if(e.scrollWidth<=e.clientWidth+1)return;const w=e.textContent.split(" "),k=w.findIndex(x=>x&&x!==x.toUpperCase());if(k>0)e.textContent=w.slice(0,k).join(" ")+" "+w.slice(k).map(x=>x.charAt(0).toUpperCase()+".").join(" ");let f=parseFloat(getComputedStyle(e).fontSize),n=0;while(e.scrollWidth>e.clientWidth+1&&f>10&&n++<12){f-=.5;e.style.fontSize=f+"px"}})}
new MutationObserver(()=>setTimeout(pfit,0)).observe(document.getElementById("m"),{childList:true});
load();
</script></body></html>
