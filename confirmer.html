<script>
const Q=new URLSearchParams(location.search),$=id=>document.getElementById(id),m=$("m");
const d64=t=>{try{t=(t||"").replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return decodeURIComponent(escape(atob(t)))}catch(e){return""}};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let L=[];try{L=JSON.parse(d64(Q.get("p")))||[]}catch(e){}
const title=d64(Q.get("t")),ref=Q.get("r")||"",own=Q.get("o")||"",key=Q.get("k")||"";
$("tt").textContent=title||"Confirmation de présence";
const doneK=t=>"pp_cf_"+t;const isDone=t=>{try{return !!localStorage.getItem(doneK(t))}catch(e){return false}};
function home(){if(!L.length||!ref||!own||!key){m.innerHTML='<h1>Lien incomplet</h1><p class="err">Ce lien de confirmation ne fonctionne pas. Réponds directement au mail de convocation.</p>';return}
if(L.length==1)return ask(0);
m.innerHTML='<h1>Qui es-tu ?</h1><p>Touche ton nom pour confirmer ta présence au tournoi.</p>'+L.map((x,i)=>'<button class="b" onclick="ask('+i+')">'+(isDone(x[0])?"✅ ":"👤 ")+esc(x[1])+'</button>').join("")}
function ask(i){const x=L[i];if(isDone(x[0]))return ok(i,true);m.innerHTML='<div class="big">🎾</div><h1>'+esc(x[1])+'</h1><p>Tu confirmes ta présence'+(title?' au tournoi <b>'+esc(title)+'</b>':'')+' ?</p><button class="b go" id="gb" onclick="send('+i+')">✅ Oui, je confirme ma présence</button>'+(L.length>1?'<button class="b ln" onclick="home()">← Ce n’est pas moi</button>':'')}
async function send(i){const x=L[i],b=$("gb");b.disabled=true;b.textContent="Envoi…";
try{const r=await fetch("https://"+ref+".supabase.co/rest/v1/padel_confirm",{method:"POST",headers:{"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({owner:own,token:x[0]})});
if(!r.ok)throw new Error("Erreur "+r.status);try{localStorage.setItem(doneK(x[0]),"1")}catch(e){}ok(i,false)}catch(e){b.disabled=false;b.textContent="✅ Réessayer";m.insertAdjacentHTML("beforeend",'<p class="err">La confirmation n’est pas passée ('+esc(e.message)+'). Vérifie ta connexion et réessaie, ou réponds au mail.</p>')}}
function ok(i,again){const x=L[i],pr=(x[1]||"").split(" ")[0];m.innerHTML='<div class="big">✅</div><h1>Merci '+esc(pr)+', c’est noté !</h1><p>'+(again?"Ta présence est déjà confirmée.":"Ta présence est confirmée. À bientôt sur les pistes !")+'</p>'+(L.length>1?'<button class="b ln" onclick="home()">Confirmer pour un autre joueur</button>':'')}
home();
</script></body></html>
